property_assertions:
  - Every material Call Pack fact must trace to an EvidenceRecord.
  - Repeated observations never create repeated canonical channel score points.
  - Unknown ad status never renders as no_confirmed without appropriate evidence.
  - Technology signals never become backend workflow facts.
  - Stale current-ad evidence must be refreshed or omitted from current-tense hook.
  - Aggregators are not silently assigned to local contractors.
  - A no-sale outcome can be correct even for a pre-call Tier A prospect.
