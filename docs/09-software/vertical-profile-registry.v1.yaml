cross_profile_rules:
  account_identity_global: true
  dnc_global_by_policy_scope: true
  contact_history_account_wide: true
  campaign_context_selects_active_profile: true
  secondary_profiles_preserved: true
  classification_score_separate_from_module4c: true
  stricter_safety_boundary_wins: true
  ambiguous_profile_blocks_vertical_specific_claims: true

special_contexts:
  - id: collision_hail_overlap
    profiles: [collision-repair-us-v1, pdr-hail-us-v1]
    rule: Active campaign context selects ordinary collision vs storm/hail workflow; same Account may carry both.
  - id: hvac_plumbing_overlap
    profiles: [hvac-us-v1, plumbing-us-v1]
    rule: Same home-service company may legitimately have both profiles; no duplicate Account/contact history.
  - id: law_practice_area
    profiles: [law-firms-us-v1]
    rule: Practice-area context is required for ad-specific query and opener language.
  - id: healthcare_privacy
    profiles: [dental-us-v1, med-spas-us-v1]
    rule: Privacy/clinical boundaries apply and may only become stricter based on implementation requirements.
  - id: urgent_home_service_family
    profiles: [hvac-us-v1, plumbing-us-v1, electrical-us-v1, restoration-us-v1, garage-door-us-v1]
    rule: Shared missed-call concepts do not erase vertical-specific safety, economics, search terms, or decision-maker routing.
