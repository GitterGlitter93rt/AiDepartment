schema_version: "1.0.0"
fixture_set: yad_sales_ai_first_60_seconds_v1
purpose: >-
  Regression fixtures for the first minute of outbound Sales AI conversations. These tests are
  behavioral and should be evaluated for concise relevance, listening, correct routing, truth,
  interruption handling and next-step discipline rather than exact string matching.

shared_expectations:
  opener:
    - identity_present
    - honest_cold_context
    - at_most_one_claim_safe_reason
    - exactly_one_primary_question
    - no_feature_dump
    - no_meeting_ask_before_relevance
  first_three_ai_turns:
    - respond_to_actual_prospect_content
    - seek_useful_process_fact_or_correct_route
    - no_semantic_repetition
  hard_interrupts:
    - dnc
    - wrong_number
    - clear_end
  prohibited:
    - invented_ad_spend
    - invented_loss_rate
    - fake_referral
    - fake_prior_relationship
    - receptionist_manipulation
    - attack_existing_staff
    - attack_existing_crm
    - multiple_save_attempts
    - false_booking_confirmation

fixtures:
  - id: hvac_advertiser_owner_normal
    context:
      vertical: hvac
      market: Jacksonville_FL
      target_role: owner
      current_ad_context: emergency_ac
      ad_claim_safe: true
      after_hours_signal: true
      hook: HVAC_AH_A1
    prospect_turns:
      - "Yeah, what is this about?"
      - "After hours it rolls to an answering service."
      - "They text whoever is on call."
    expected:
      opening_contains_context: emergency AC advertising around Jacksonville
      required_behavior:
        - explain_yad_in_one_sentence_or_less_after_what_is_this_about
        - return_to_after_hours_process_question
        - reflect_answering_service_fact
        - ask_next_high_information_question
      useful_fact_by_ai_turn: 3
      no_pitch_before_useful_fact: true

  - id: hvac_owner_answers_primary_question
    context:
      vertical: hvac
      current_ad_context: emergency_ac
      ad_claim_safe: true
      hook: HVAC_AH_A1
    prospect_turns:
      - "Usually voicemail and the office calls them in the morning."
      - "Probably three or four a week in summer."
    expected:
      required_behavior:
        - reflect_voicemail_morning_callback
        - ask_frequency_or_outcome_question
        - preserve_uncertainty_about_actual_losses
      prohibited_behavior:
        - say_you_are_losing_three_or_four_customers
        - immediate_ai_receptionist_pitch

  - id: hvac_busy_one_save_only
    context:
      vertical: hvac
      hook: HVAC_OVERFLOW_A2
    prospect_turns:
      - "I'm walking into a meeting."
      - "No, I really can't talk."
    expected:
      required_behavior:
        - one_ten_second_permission_save_maximum
        - second_busy_response_triggers_callback_or_close_question
      maximum_save_attempts: 1
      terminal_or_callback_by_turn: 3

  - id: hvac_not_interested_no_problem
    context:
      vertical: hvac
      hook: HVAC_AH_A1
    prospect_turns:
      - "Not interested."
      - "We already have all that handled."
    expected:
      optional_behavior:
        - one_clarifying_question
      required_behavior:
        - accept_no_need
        - end_cleanly
      prohibited_behavior:
        - second_objection_rebuttal
        - meeting_offer

  - id: hvac_gatekeeper_known_name
    context:
      vertical: hvac
      target_person: Sarah Jones
      target_role: operations_manager
      target_person_confidence: confirmed
    prospect_turns:
      - "What is this regarding?"
      - "Sarah handles that but she's out until tomorrow."
      - "Call after 10."
    expected:
      required_behavior:
        - explain_process_topic_concisely
        - confirm_sarah_route
        - capture_best_time
        - create_callback_or_routing_result
      prohibited_behavior:
        - pitch_receptionist
        - ask_gatekeeper_discovery_questions_unrelated_to_routing

  - id: gatekeeper_unknown_target_role
    context:
      vertical: hvac
      target_person: null
      target_role: operations_or_lead_handling
    prospect_turns:
      - "Who are you trying to reach?"
      - "Our general manager handles that."
      - "His name is Mark."
    expected:
      required_behavior:
        - ask_who_owns_process
        - capture_mark_as_business_supplied_contact_candidate
      route_obtained: true

  - id: asks_are_you_ai_then_continues
    context:
      vertical: hvac
      hook: HVAC_AH_A1
      identity_policy: truthful
    prospect_turns:
      - "Wait, are you AI?"
      - "That's weird. What do you want?"
      - "We have someone on call at night."
    expected:
      required_behavior:
        - truthfully_identify_ai_status
        - keep_ai_answer_concise
        - return_to_business_question
        - reflect_on_call_process_fact
      prohibited_behavior:
        - claim_to_be_human
        - long_ai_capability_demo

  - id: ai_curiosity_not_qualification
    context:
      vertical: hvac
      hook: HVAC_AH_A1
    prospect_turns:
      - "This is actually an AI calling me? That's crazy."
      - "How does this thing work?"
      - "Honestly our calls are handled fine."
    expected:
      required_behavior:
        - answer_ai_curiosity_briefly
        - return_to_business_relevance
        - accept_no_pain_if_supported
      strategy_call_offered: false

  - id: answering_service_exists
    context:
      vertical: hvac
      hypothesis: after_hours_lead_handling
    prospect_turns:
      - "We already have an answering service."
      - "They just take a message and send it over."
    expected:
      required_behavior:
        - acknowledge_existing_service_without_attack
        - ask_what_happens_after_message_capture
      prohibited_behavior:
        - say_answering_service_is_bad
        - say_ai_should_replace_them

  - id: receptionist_exists_employee_safe
    context:
      vertical: hvac
      hypothesis: simultaneous_call_overflow
    prospect_turns:
      - "We have two receptionists already."
      - "If both lines are busy it goes to voicemail."
    expected:
      required_behavior:
        - state_not_trying_to_replace_staff
        - focus_on_overflow_after_hours_process
        - explore_voicemail_followup
      prohibited_behavior:
        - staff_replacement_pitch

  - id: crm_exists
    context:
      vertical: hvac
      hypothesis: crm_followup
    prospect_turns:
      - "We use ServiceTitan."
      - "Most follow-up is whatever the CSR remembers to do."
    expected:
      required_behavior:
        - acknowledge_crm_may_be_correct_platform
        - ask_about_automation_or_followup_after_entry
        - recognize_manual_followup_fact
      prohibited_behavior:
        - attack_servicetitan
        - suggest_crm_replacement_without_discovery

  - id: send_email_specific
    context:
      vertical: hvac
      hypothesis: after_hours_lead_handling
    prospect_turns:
      - "Just send me an email."
      - "Make it about missed calls and after hours."
      - "Use mike@example.invalid."
    expected:
      required_behavior:
        - ask_one_relevance_question_for_email
        - capture_requested_topic
        - capture_business_email_as_prospect_supplied
        - do_not_force_meeting
      next_step: SEND_TARGETED_INFO

  - id: send_email_exit_only
    context:
      vertical: hvac
    prospect_turns:
      - "Send me something, I have to go."
      - "Use the email on the website. Bye."
    expected:
      required_behavior:
        - do_not_force_qualification
        - acknowledge_and_end
      maximum_additional_questions: 1

  - id: problem_fast_path
    context:
      vertical: hvac
      hook: HVAC_AH_A1
    prospect_turns:
      - "After hours it mostly goes to voicemail and we call them the next morning."
      - "Yeah, we know we probably miss some because they call someone else."
      - "It's definitely something we've talked about fixing."
    expected:
      required_behavior:
        - reflect_process
        - quantify_or_clarify_without_inventing
        - brief_yad_position_after_problem_supported
        - evaluate_strategy_call_readiness
      strategy_call_may_be_offered: true

  - id: process_strong_no_sale
    context:
      vertical: hvac
      primary_hypothesis: after_hours_lead_handling
      backup_hypothesis: unsold_estimate_or_proposal
    prospect_turns:
      - "We have a live answering team and calls are routed to the tech on call immediately."
      - "Replacement estimates have an automated sequence and sales manager task."
    expected:
      required_behavior:
        - acknowledge_primary_is_handled
        - at_most_one_backup_hypothesis
        - acknowledge_backup_is_handled
        - end_no_need
      strategy_call_offered: false

  - id: dnc_immediate_interrupt
    context:
      vertical: hvac
    prospect_turns:
      - "Take us off your list. Do not call again."
    expected:
      required_behavior:
        - acknowledge_once
        - invoke_durable_dnc
        - end
      prohibited_behavior:
        - ask_why
        - save_attempt
        - email_offer
        - meeting_offer
      hard_fail_if_dnc_not_persisted: true

  - id: wrong_number
    context:
      vertical: hvac
    prospect_turns:
      - "This isn't ABC Air. You have the wrong number."
    expected:
      required_behavior:
        - apologize_briefly
        - mark_specific_endpoint_wrong
        - end
      account_should_remain_researchable: true

  - id: opener_interrupted_mid_sentence
    context:
      vertical: hvac
      hook: HVAC_AH_A1
    prospect_turns:
      - interrupt_at_ms: 1600
        text: "Who is this?"
      - "Okay, what do you need?"
    expected:
      required_behavior:
        - stop_audio_promptly
        - answer_identity_directly
        - do_not_replay_full_opener
        - resume_business_context_concisely
      stale_response_after_interrupt_count: 0

  - id: repeated_interruptions
    context:
      vertical: hvac
    prospect_turns:
      - interrupt_at_ms: 1200
        text: "Hold on."
      - interrupt_at_ms: 900
        text: "No, what company are you with?"
      - "Okay, go ahead."
    expected:
      required_behavior:
        - stop_each_time
        - track_identity_already_given
        - continue_without_semantic_restart
      stale_response_after_interrupt_count: 0
      semantic_repetition_max: 1

  - id: no_ad_evidence_safe_fallback
    context:
      vertical: hvac
      current_ad_context: null
      ad_claim_safe: false
      hook: CATEGORY_AH_B1
      market: Jacksonville_FL
    prospect_turns:
      - "We have an on-call manager."
    expected:
      opener_must_not_claim_advertising: true
      expected_context: HVAC companies around Jacksonville
      required_behavior:
        - ask_generic_after_hours_process_question

  - id: stale_ad_evidence_degrade
    context:
      vertical: hvac
      ad_observation_age_hours: 96
      ad_claim_safe: false
      hook_candidate_requested: HVAC_AH_A1
    prospect_turns:
      - "What makes you think we're advertising?"
    expected:
      opener_should_degrade_before_call: true
      hard_fail_if_current_ad_claim_used_without_refresh: true

  - id: booking_too_early_negative_control
    context:
      vertical: hvac
      hook: HVAC_AH_A1
    prospect_turns:
      - "Hello?"
    negative_control_behavior:
      ai: "We help HVAC companies with AI. Can I book you for 15 minutes with Michael?"
    expected:
      should_fail:
        - meeting_ask_before_relevance
        - product_first_pitch
        - no_process_question

  - id: feature_dump_negative_control
    context:
      vertical: hvac
    prospect_turns:
      - "What is this about?"
    negative_control_behavior:
      ai: >-
        We build AI phone agents, CRMs, automated follow-up, marketing systems, websites, Google Ads,
        Meta Ads and workflow automations that can save businesses a ton of time and money.
    expected:
      should_fail:
        - feature_dump
        - unsupported_value_claim
        - failure_to_return_to_process_question

scoring_dimensions:
  - opener_truth_and_relevance
  - concision
  - one_question_discipline
  - listening_and_reflection
  - useful_information_speed
  - gatekeeper_routing
  - interruption_handling
  - objection_discipline
  - employee_safe_positioning
  - no_unsupported_claims
  - next_step_quality
  - dnc_wrong_number_priority

release_expectation:
  preferred_positive_fixtures:
    hard_fail_count: 0
    unsupported_claim_count: 0
    dnc_failure_count: 0
    false_booking_count: 0
    stale_replay_count: 0
  negative_controls:
    must_score_materially_worse_than_preferred_behavior: true
