property_assertions:
  - A different vertical campaign never creates a second Account when entity resolution identifies the same business.
  - DNC and contact history apply account-wide across vertical assignments.
  - Campaign context selects the active profile; secondary profiles remain evidence/context, not mixed prompts.
  - Classification confidence is separate from Module 4C fit score.
  - A profile-specific ad opener requires fresh ad evidence for the same relevant service/practice area.
  - Professional and safety boundaries accumulate; a secondary profile cannot weaken a primary/global boundary.
  - Unsupported or unresolved verticals fail closed for vertical-specific Call Pack generation.
  - No profile may add hidden fit points beyond canonical Module 4C.
  - No-sale remains a valid high-quality outcome after prospect facts disprove the hypothesis.
