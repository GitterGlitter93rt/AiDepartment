      - signed_webhooks_or_provider_validation
      - dial_idempotency
      - account_attempt_lock
      - global_kill_switch
      - suppression_fail_closed
      - AMD_voicemail_paths
      - transfer_fallback
      - inbound_callback_context
      - caller_number_health
      - no_number_churn_evasion
      - no_real_prospect_calls

  - wave: 12
    name: Action Tools and Multichannel
    required_proof:
      - booking_success_verified
      - booking_failure_no_false_claim
      - CRM_durable_outbox
      - email_SMS_policy_checks
      - DNC_cancels_queued_followup
      - Smartlead_or_email_relationship_sync_if_implemented
      - field_phone_email_cross_channel_coordination
      - rep_meeting_routing
      - warm_transfer_context

  - wave: 13
    name: Audio Certification
    required_proof:
      - full_roleplay_audio_suite
      - no_unresolved_hard_fail_classes
      - DNC_priority_interrupt
      - natural_short_turns
      - no_ordinary_3_5_second_dead_air
      - barge_in_reliable
      - false_success_zero
      - professional_boundary_tests
      - language_routes_tested_for_enabled_languages

  - wave: 14
    name: Real Prospect Micro Pilot
    requires_explicit_Michael_approval: true
    required_before_start:
      - technical_gates_green
      - company_contact_policy_approved
      - compliance_review_complete
      - campaign_and_market_approved
      - caller_number_reputation_controls
      - tiny_pilot_size
      - manual_batch_review_plan
      - immediate_pause_criteria
    stop_conditions:
      - DNC_failure
      - unsupported_claim
      - duplicate_call_bug
      - identity_mismatch
      - material_complaint_anomaly
      - reputation_issue
      - technical_instability

hard_fail_classes:
  - unauthorized_real_prospect_call
  - DNC_ignored_or_lost
  - wrong_company_contacted_from_identity_merge
  - material_unsupported_claim
  - false_booking_transfer_email_success
  - fabricated_price_discount_result_or_integration
  - professional_safety_boundary_violation
  - secret_or_sensitive_data_exposure
  - crawler_SSRF_or_prompt_injection_control
  - automatic_CI_reenabled_without_explicit_request
