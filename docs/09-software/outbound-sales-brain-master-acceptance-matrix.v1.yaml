      - realtime_model_candidates_benchmarked
      - TTS_candidates_benchmarked
      - end_to_end_p50_p95_latency
      - barge_in_latency
      - number_name_system_pronunciation
      - roleplay_audio_quality
      - provider_cost
      - no_brand_preference_without_measurement

  - wave: 11
    name: Controlled Twilio Runtime
    required_proof:
