acceptance_matrix_id: yad_outbound_sales_brain_v1
version: 1.0.0
status: architecture_authority

principles:
  - A file compiling is not a gate pass.
  - Severe truth, DNC, identity, security, professional-boundary, or false-tool-success failures block release regardless of average score.
  - Production autonomous prospect calling is not authorized by this matrix; explicit business/policy approval is still required.

waves:
  - wave: 0
    name: Gate 0 Environment Audit
    required_proof:
      - current_repo_and_phone_agent_audited
      - EdgeXpert_local_test_workflow_documented
      - existing_Twilio_runtime_audited
      - persistence_and_queue_state_identified
      - reuse_vs_replace_map
      - automatic_CI_remains_manual_only
      - production_dialing_off

  - wave: 1
    name: Prospect Factory Core
    required_proof:
      - canonical_domain_schema_implemented
      - durable_migrations
      - evidence_claim_registry_semantics_pass
      - module4c_all_fixtures_exact
      - HVAC_and_Plumbing_profiles_validate
      - geography_planner_passes_fixtures
      - fake_provider_pipeline_passes
      - SERP_normalizer_passes_provider_equivalence_tests
      - entity_resolution_fixtures_pass
      - website_security_SSRF_prompt_injection_tests_pass
      - false_positive_fixtures_pass
      - opportunity_hypothesis_tests_pass
      - decision_maker_routing_tests_pass
      - ready_queue_tests_pass

  - wave: 1.5
    name: First Real Market Miner Proof
    required_proof:
      - provider_docs_pricing_terms_revalidated
      - Jacksonville_StAugustine_HVAC_run_completed
      - no_contact_performed
      - paid_observations_have_query_time_geography
      - dedupe_quality_manual_audit
      - at_least_20_ready_prospects_random_manual_audit
      - scoring_exact_on_audit
      - no_pixel_as_active_ad_errors
      - no_failed_detection_as_negative_errors
      - provider_cost_per_TierBplus_reported
      - coverage_shortfall_reported_honestly_if_under_target

  - wave: 2
