public_signal_rules:
  - signal_id: active_hail_google_ads
    category: paid_acquisition
    evidence_claim_key: active_google_search_ad
    confidence_required: confirmed
    why_it_matters: Current hail advertising in an active market creates a high-value reason to test lead surge, assignment, appointments and attribution.
    possible_hypothesis_ids:
      - storm_lead_surge
      - paid_lead_assignment
      - market_attribution
    score_rule_reference: module4c_google_ads_plus4
  - signal_id: active_hail_meta_ads
    category: paid_acquisition
    evidence_claim_key: active_meta_ad
    confidence_required: confirmed
    why_it_matters: Active hail creatives can create high-volume form/social leads requiring rapid routing and market-specific follow-up.
    possible_hypothesis_ids:
      - storm_lead_surge
      - paid_lead_assignment
      - appointment_no_show
    score_rule_reference: module4c_meta_ads_plus3
  - signal_id: recent_market_launch
    category: growth
    evidence_claim_key: visible_growth_hiring
    confidence_required: confirmed
    why_it_matters: A new hail market increases relevance of reusable setup, routing, training and reporting workflows.
    possible_hypothesis_ids:
      - market_launch_repeatability
      - multi_market_visibility
    score_rule_reference: module4c_growth_plus1
  - signal_id: multiple_markets
    category: scale
    evidence_claim_key: multiple_locations
    confidence_required: confirmed
    why_it_matters: Multiple storm markets increase lead ownership, reporting, routing and attribution complexity.
    possible_hypothesis_ids:
      - multi_market_visibility
      - market_attribution
      - field_lead_capture
    score_rule_reference: module4c_multiple_locations_plus1
  - signal_id: appointment_cta
    category: lead_capture
    evidence_claim_key: online_quote_booking
    confidence_required: confirmed
    why_it_matters: Appointment-driven hail repair makes reminder, reschedule and no-show workflows measurable.
    possible_hypothesis_ids:
      - appointment_no_show
      - paid_lead_assignment
    score_rule_reference: module4c_lead_capture_plus1
  - signal_id: field_sales_signal
    category: sales_operations
    evidence_claim_key: field_sales_presence
    confidence_required: likely
    why_it_matters: Field sales can create pipeline visibility and company-owned lead-data issues if leads stay on personal devices.
    possible_hypothesis_ids:
      - field_lead_capture
    score_rule_reference: vertical_priority_signal_only

