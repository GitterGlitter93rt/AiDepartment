    - text: How quickly are hail leads contacted after a storm?
      purpose: speed to lead
  phone_after_hours:
    - text: What happens to hail calls when surge volume overwhelms the office?
      purpose: overflow
  scheduling_dispatch:
    - text: What is the appointment show rate and how are no-shows recovered?
      purpose: appointment utilization
  sales_follow_up:
    - text: How many leads never receive a second follow-up?
      purpose: lead follow-up
  retention_reactivation:
    - text: How are old storm leads and unscheduled estimates handled?
      purpose: database lifecycle
  employee_capacity:
    - text: Which office task explodes fastest during the first two weeks after a storm?
