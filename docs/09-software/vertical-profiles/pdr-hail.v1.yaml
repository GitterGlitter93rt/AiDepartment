objection_guidance:
  - objection_id: hail_too_fast_for_crm
    match_phrases:
      - hail is too fast for a CRM
    principle: The pipeline should reduce work, not create field bureaucracy.
    response_guidance: Explain that speed is why mobile capture and minimal required fields matter; ask what reps can realistically use.
    follow_up_questions:
      - What information can a rep capture in under a minute?
    must_not_say:
      - force reps into long data entry
    manual_reference: module-14-pdr-hail-industry-playbook.md#29-pdr--hail-objections
  - objection_id: reps_keep_leads_in_phones
    match_phrases:
      - our guys keep everything in their phones
    principle: Do not accuse reps; focus on business visibility and continuity.
    response_guidance: Ask whether management can see/protect pipeline across reps and markets.
    follow_up_questions:
      - If a rep leaves the market, does the company retain the full lead history and next actions?
    must_not_say:
      - your reps are stealing leads
    manual_reference: module-14-pdr-hail-industry-playbook.md#29-pdr--hail-objections
  - objection_id: just_need_more_leads
    match_phrases:
      - we just need more leads
    principle: Measure existing funnel before adding demand.
    response_guidance: Ask what percentage of current leads are contacted, scheduled, shown and repaired.
    follow_up_questions:
      - How many current leads make it to appointment and vehicle-in?
    must_not_say:
      - you are wasting all your ad money
    manual_reference: module-14-pdr-hail-industry-playbook.md#29-pdr--hail-objections
  - objection_id: every_storm_different
    match_phrases:
      - every storm is different
    principle: Market conditions change, but core pipeline stages can still be standardized.
    response_guidance: Agree and isolate repeatable launch/capture/assignment/appointment/reporting components.
    follow_up_questions:
      - Which parts are repeated every storm regardless of city?
    must_not_say: []
    manual_reference: module-14-pdr-hail-industry-playbook.md#29-pdr--hail-objections

safety_boundaries:
  - boundary_id: insurance_claim
    category: insurance_legal
    prohibited_agent_claims:
      - coverage_decision
      - deductible_legality_claim
      - claim_outcome_guarantee
      - unauthorized_adjusting_advice
    human_required_for:
      - claim_specific_questions
      - coverage_questions
      - sensitive_financial_questions
    escalation_guidance: Hail phone/automation workflows can capture approved intake and schedule, but claim-specific and coverage questions route to qualified humans.
  - boundary_id: vehicle_repair
    category: technical_safety
    prohibited_agent_claims:
      - PDR_repairability_decision
      - repair_scope_decision
      - vehicle_safety_clearance
    human_required_for:
      - damage_assessment
      - repair_plan
      - quality_control
    escalation_guidance: Qualified repair professionals retain technical and safety judgment.
  - boundary_id: repair_status_truth
    category: communication_truth
    prohibited_agent_claims:
