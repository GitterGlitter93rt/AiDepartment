leak_hypotheses:
  - hypothesis_id: storm_lead_surge
    category: speed_to_lead
    title: Hail lead surge may overwhelm normal intake capacity
    description: Storm markets can create a temporary flood of calls, forms, social and field leads faster than normal staff/processes can organize them.
    trigger_signals:
      - active_hail_google_ads
      - active_hail_meta_ads
      - recent_market_launch
    disqualifying_signals:
      - prospect_confirms_strong_measured_surge_system
    public_fact_requirements:
      - current_hail_market_evidence_if_referenced
    questions_to_verify:
      - When storm volume spikes, do phone, web, Meta and field leads all land in the same trackable pipeline?
      - Which office task explodes first during the first two weeks after a storm?
    primary_hook_template: I noticed you are actively marketing hail repair in [market]. When volume spikes, how do phone, web, Meta and field leads all get into the same follow-up system?
    backup_hook_templates:
      - What happens when the office gets more hail calls than it can answer live?
    offer_families:
      - ai_growth_systems
      - ai_implementation
    roi_tool_ids:
      - lead_response_roi
      - employee_capacity_roi
    must_not_claim:
      - known_lead_volume
      - leads_are_currently_being_lost
  - hypothesis_id: field_lead_capture
    category: crm_workflow
    title: Field leads may live on reps' personal devices instead of the company pipeline
    description: Mobile hail sales can create lead-ownership and management-visibility problems when contact details, next actions and outcomes are not centralized.
    trigger_signals:
      - field_sales_signal
      - multiple_markets
    disqualifying_signals:
      - prospect_confirms_shared_mobile_CRM_and_visibility
    public_fact_requirements: []
    questions_to_verify:
      - If a field rep collects 30 leads today, can management see every one and its next action tomorrow morning?
      - Does the company own the lead record or does the rep's phone own it?
    primary_hook_template: If one field rep generates 30 leads this weekend, can management see every lead, next action and eventual repair without asking the rep?
    backup_hook_templates:
      - How are field leads tagged by rep, source and market?
    offer_families:
      - ai_implementation
      - managed_ai_department
    roi_tool_ids:
      - lead_response_roi
    must_not_claim:
      - field_reps_are_hiding_leads
  - hypothesis_id: appointment_no_show
    category: appointment_no_show
    title: Valuable hail appointment capacity may be lost to no-shows and weak rescheduling
    description: Event-driven appointment volume makes confirmation, reminders, easy rescheduling and no-show recovery worth measuring.
    trigger_signals:
      - appointment_cta
      - active_hail_ads
    disqualifying_signals:
      - prospect_confirms_high_show_rate_and_strong_recovery
    public_fact_requirements: []
    questions_to_verify:
      - What percentage of hail appointments show?
      - What happens automatically after a no-show or reschedule request?
    primary_hook_template: What happens to a hail appointment after the customer no-shows or needs to reschedule?
    backup_hook_templates:
      - How much appointment capacity sits unused because follow-up is inconsistent?
    offer_families:
      - ai_implementation
      - ai_growth_systems
    roi_tool_ids:
      - no_show_roi
    must_not_claim:
      - known_no_show_rate_without_data
  - hypothesis_id: market_launch_repeatability
    category: integration
    title: New hail markets may require repetitive manual setup
    description: Numbers, landing pages, campaigns, CRM stages, calendars, scripts, reporting and permissions may be rebuilt each storm instead of instantiated from a reusable template.
    trigger_signals:
      - recent_market_launch
      - multiple_markets
    disqualifying_signals:
      - prospect_confirms_repeatable_launch_template
    public_fact_requirements: []
    questions_to_verify:
      - When you enter a new city, what has to be rebuilt manually?
      - How long until phones, forms, rep assignment, appointments and reporting are visible in one system?
    primary_hook_template: When you enter a new hail market, how much of the operating system has to be rebuilt manually?
    backup_hook_templates:
      - How fast can you launch a fully tracked market after a storm?
    offer_families:
      - ai_implementation
      - managed_ai_department
    roi_tool_ids:
      - employee_capacity_roi
    must_not_claim:
      - current_launch_process_is_slow_without_confirmation
  - hypothesis_id: market_attribution
    category: attribution
    title: Lead source and market may not tie cleanly to completed repair revenue
    description: Google, Meta, field, dealer and referral channels can be compared properly only when source survives through appointment, vehicle-in, completed repair and revenue.
    trigger_signals:
      - active_hail_google_ads
      - active_hail_meta_ads
      - multiple_markets
      - field_sales_signal
    disqualifying_signals:
      - prospect_confirms_closed_loop_market_attribution
    public_fact_requirements: []
    questions_to_verify:
      - Can you compare cost per completed repair by market and lead source?
      - Which sources produce vehicles-in, not just leads?
    primary_hook_template: Can you compare completed repairs and revenue by Google, Meta, field rep and market today?
    backup_hook_templates:
      - Which source produces the most vehicles-in rather than the most leads?
    offer_families:
      - ai_growth_systems
      - ai_implementation
    roi_tool_ids:
      - advertising_efficiency_roi
    must_not_claim:
      - attribution_is_broken

