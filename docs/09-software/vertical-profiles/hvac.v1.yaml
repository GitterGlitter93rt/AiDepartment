    handoff_risks: []
    human_judgment_required: false
  - stage_id: acquisition
    label: Search / Maps / Referral / Ad / Existing customer
    common_inputs:
      - google
      - maps
      - referral
      - paid_ad
      - existing_customer
    common_outputs:
      - call
      - form
      - booking
    handoff_risks:
      - attribution_loss
    human_judgment_required: false
  - stage_id: intake
    label: Call / Form / Booking and intake
    common_inputs:
      - phone
      - web_form
      - booking
    common_outputs:
