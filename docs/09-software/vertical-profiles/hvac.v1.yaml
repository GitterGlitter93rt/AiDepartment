public_signal_rules:
  - signal_id: active_google_search_ads
    category: paid_acquisition
    evidence_claim_key: active_google_search_ad
    confidence_required: confirmed
    why_it_matters: Indicates current willingness to pay for high-intent customer acquisition and makes downstream response/follow-up/attribution questions more relevant.
    possible_hypothesis_ids:
      - paid_after_hours_call_handling
      - speed_to_lead
      - attribution_gap
    score_rule_reference: module4c_google_ads_plus4
  - signal_id: active_meta_ads
    category: paid_acquisition
    evidence_claim_key: active_meta_ad
    confidence_required: confirmed
    why_it_matters: Indicates current paid demand generation on Meta and can make lead-response/follow-up/booking questions relevant.
    possible_hypothesis_ids:
      - speed_to_lead
      - lead_follow_up
      - attribution_gap
    score_rule_reference: module4c_meta_ads_plus3
  - signal_id: emergency_24_7
    category: urgency
    evidence_claim_key: emergency_24_7_service
    confidence_required: confirmed
    why_it_matters: Creates after-hours and surge-handling relevance.
    possible_hypothesis_ids:
      - paid_after_hours_call_handling
      - missed_call_recovery
      - surge_capacity
    score_rule_reference: module4c_after_hours_plus1
  - signal_id: financing_promoted
    category: replacement_sales
    evidence_claim_key: financing_promoted
    confidence_required: confirmed
    why_it_matters: Often accompanies higher-value replacement sales and follow-up needs.
    possible_hypothesis_ids:
      - unsold_replacement_estimates
      - financing_follow_up
    score_rule_reference: vertical_priority_signal_only
  - signal_id: multiple_locations
    category: scale
    evidence_claim_key: multiple_locations
    confidence_required: confirmed
    why_it_matters: Increases routing, reporting, attribution and consistency complexity.
    possible_hypothesis_ids:
      - attribution_gap
      - routing_consistency
      - reporting_visibility
    score_rule_reference: module4c_multiple_locations_plus1
  - signal_id: online_quote_or_booking
    category: lead_capture
    evidence_claim_key: online_quote_booking
    confidence_required: confirmed
    why_it_matters: Shows an observable lead-entry path worth mapping.
    possible_hypothesis_ids:
      - speed_to_lead
      - lead_follow_up
      - crm_capture
    score_rule_reference: module4c_lead_capture_plus1
  - signal_id: visible_hiring
    category: growth
    evidence_claim_key: visible_growth_hiring
    confidence_required: confirmed
    why_it_matters: Can make employee-capacity and scaling questions more relevant.
    possible_hypothesis_ids:
      - employee_capacity
      - surge_capacity
    score_rule_reference: module4c_growth_plus1

