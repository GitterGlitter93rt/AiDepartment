    name: Lead Response ROI
    relevant_hypothesis_ids:
      - after_hours_intake
      - first_response_follow_up
    required_inputs:
      - inquiries
      - unsuccessfully_contacted_percent
      - legitimately_qualified_percent
      - conservative_incremental_retention_scenario
      - firm_selected_value_metric
    prohibited_shortcuts:
      - guessing_case_value
      - using_one_practice_area_economics_for_another
      - treating_every_inquiry_as_qualified
  - roi_tool_id: no_show_roi
    name: No-Show ROI
    relevant_hypothesis_ids:
      - consultation_no_show
    required_inputs:
      - scheduled_consultations
      - no_show_rate
      - realistically_recoverable_percent
      - retained_conversion_metric
      - firm_selected_value_metric
    prohibited_shortcuts:
      - treating_every_consultation_as_future_client
  - roi_tool_id: employee_capacity_roi
    name: Employee Capacity ROI
    relevant_hypothesis_ids:
      - administrative_capacity
    required_inputs:
      - employee_count
      - repetitive_hours
      - addressable_percent
      - loaded_hourly_cost
    prohibited_shortcuts:
      - guaranteed_payroll_savings
  - roi_tool_id: advertising_efficiency_roi
    name: Advertising Efficiency
    relevant_hypothesis_ids:
      - retained_client_attribution
    required_inputs:
      - actual_ad_cost
      - inquiries
      - qualified_inquiries
      - consultations
      - retained_clients
      - firm_selected_value_metric
    prohibited_shortcuts:
      - guessing_ad_spend
      - assuming_collected_revenue_timing

objection_guidance:
  - objection_id: clients_want_lawyer_not_ai
    match_phrases:
      - clients want a lawyer not AI
    principle: Agree that legal advice/judgment remains with lawyers; focus on administrative workflow.
    response_guidance: Position intake capture, scheduling, reminders, summaries, CRM updates and document organization as support around attorney relationships.
    follow_up_questions:
      - Which parts of intake are repetitive administration and which require legal judgment?
    must_not_say:
      - AI can replace the lawyer
    manual_reference: module-15-law-firms-industry-playbook.md#32-law-firm-objections
  - objection_id: confidentiality
    match_phrases:
      - confidentiality makes this impossible
    principle: Confidentiality increases governance requirements; it does not justify casual tool use.
    response_guidance: Ask about data types, vendor terms, permissions, retention and approved tools before recommending anything.
    follow_up_questions:
      - Which data can never enter an external AI tool?
    must_not_say:
      - our system automatically makes you compliant
    manual_reference: module-15-law-firms-industry-playbook.md#32-law-firm-objections
  - objection_id: existing_legal_platform
    match_phrases:
      - we already have Clio
      - we already have Filevine
      - we already have Lawyaw
      - we already have a CRM
    principle: Existing systems are positive if configured and used well.
    response_guidance: Ask how intake, communications, follow-up, source and retained outcomes move through the current stack.
    follow_up_questions:
      - What is the biggest thing you wish the current setup did better?
    must_not_say:
      - you need a new platform
    manual_reference: module-15-law-firms-industry-playbook.md#32-law-firm-objections
  - objection_id: cannot_let_ai_qualify_cases
    match_phrases:
      - we cannot let AI qualify cases
    principle: Do not give AI final legal/case-acceptance authority.
    response_guidance: Separate structured information collection/routing from legal judgment and case acceptance.
    follow_up_questions:
      - Which fields can intake safely collect before attorney review?
    must_not_say:
      - AI can decide if a case is good
    manual_reference: module-15-law-firms-industry-playbook.md#32-law-firm-objections

safety_boundaries:
  - boundary_id: legal_advice
    category: professional_judgment
    prohibited_agent_claims:
      - legal_advice
      - case_merit_decision
      - legal_strategy
      - conflict_clearance
      - case_acceptance
      - outcome_prediction
    human_required_for:
      - legal_judgment
      - attorney_review
      - conflict_decisions
      - case_acceptance
    escalation_guidance: Route substantive legal, case evaluation and consequential decisions to qualified legal professionals.
  - boundary_id: confidentiality
    category: privacy_professional
    prohibited_agent_claims:
      - generic_public_AI_is_safe_for_confidential_data
      - vendor_terms_guarantee_confidentiality_without_review
      - YAD_certifies_ethics_compliance
    human_required_for:
      - vendor_data_policy_approval
      - privileged_or_confidential_data_policy
      - jurisdiction_specific_ethics_review
    escalation_guidance: Firm leadership/counsel must approve tools, confidentiality controls and professional obligations.
  - boundary_id: advertising_professional_rules
    category: marketing_legal
    prohibited_agent_claims:
      - outreach_is_compliant_in_every_jurisdiction
      - professional_advertising_rules_do_not_apply
    human_required_for:
      - jurisdiction_specific_marketing_rules
    escalation_guidance: Professional and jurisdictional advertising/outreach rules require firm review.

no_sale_conditions:
  - no_meaningful_workflow_problem
  - legal_advice_or_unsupervised_case_decision_requested
  - confidential_data_cannot_be_protected
  - required_vendor_or_integration_fails_firm_requirements
  - economics_weak
  - leadership_will_not_participate_in_governance
  - guaranteed_client_acquisition_or_case_outcomes_demanded
  - marketing_or_outreach_plan_conflicts_with_professional_rules

scoring_overrides:
  enabled: false
  rule: Use canonical Module 4C only. High-value and lead-volume recognition must be practice-area/evidence specific rather than automatic for every law firm.

research_requirements:
  minimum_before_research_ready:
    - company_identity
    - practice_area_attempted
    - geography
    - website_attempted
    - google_ad_check_attempted
  refresh_before_ad_specific_opener:
    - current_practice_area_paid_ad_evidence
  optional_deep_research:
    - LSA_signal
    - meta_ads
    - consultation_CTA
    - after_hours_language
    - multiple_offices
    - intake_hiring
    - legal_platform_signals
    - leadership_roles
  forbidden_research_actions:
    - fake_legal_inquiry
    - fake_consultation_request
    - fake_case_facts
    - fake_client_contact
    - inspecting_visible_client_documents

call_pack_defaults:
  preferred_primary_hook_order:
    - after_hours_intake
    - first_response_follow_up
    - attribution
    - administrative_capacity
    - ai_governance
  default_first_question: What happens to a potential client who reaches out after intake has closed or does not answer the first callback?
  employee_safe_positioning: The goal is to give attorneys and staff better systems around repetitive work while legal judgment, client relationships, confidentiality and professional responsibility stay human.
  default_prohibited_claims:
    - known_ad_spend_without_verified_data
    - known_case_value_without_firm_data
    - every_inquiry_is_qualified
    - AI_can_decide_case_merit
    - YAD_guarantees_ethics_or_confidentiality_compliance
    - generic_public_AI_is_safe_for_client_data
