    - criminal defense lawyer
    - DUI lawyer
    - personal injury lawyer
    - accident lawyer
  high_ticket_queries:
    - practice_area_dependent
  financing_queries: []
  commercial_queries:
    - business lawyer
    - employment lawyer
    - corporate law firm
  service_aliases:
    - attorney
    - lawyer
    - legal counsel
    - law office
  negative_terms:
    - law school
    - legal forms
    - court records
    - legal document templates
    - lawyer directory only
  classification_warning_terms:
    - legal lead generation site
    - referral directory
    - government legal aid
    - nonprofit legal service
    - solo practice with no growth workflow

classification_rules:
  positive_business_categories:
    - law_firm
    - attorney_office
    - legal_practice
  negative_business_categories:
    - lawyer_directory
    - legal_forms_provider
    - law_school
    - court
  website_keyword_positive:
    - free consultation
    - case evaluation
    - schedule consultation
    - call now
    - attorneys
    - practice areas
    - client intake
  website_keyword_negative:
    - attorney directory
    - legal forms only
    - law school
  required_any_of:
    - legal_service_evidence
    - attorney_practice_evidence
  exclude_if_all:
    - non_law_firm
    - no_legal_client_service_evidence
  manual_review_if:
    - referral_directory_possible
    - multi_firm_shared_brand
    - practice_area_unclear
    - legal_aid_or_nonprofit
    - franchise_network_or_lead_generator

public_signal_rules:
  - signal_id: active_google_search_ads
    category: paid_acquisition
    evidence_claim_key: active_google_search_ad
    confidence_required: confirmed
    why_it_matters: Current legal paid search creates a reason to investigate intake response, qualification, consultation scheduling, follow-up and retained-client attribution.
    possible_hypothesis_ids:
      - after_hours_intake
      - first_response_follow_up
      - retained_client_attribution
    score_rule_reference: module4c_google_ads_plus4
  - signal_id: active_meta_ads
    category: paid_acquisition
    evidence_claim_key: active_meta_ad
    confidence_required: confirmed
    why_it_matters: Meta lead generation can create form-driven potential-client inquiries requiring intake routing and follow-up.
    possible_hypothesis_ids:
      - first_response_follow_up
      - intake_completion
      - retained_client_attribution
    score_rule_reference: module4c_meta_ads_plus3
  - signal_id: consultation_cta
    category: lead_capture
    evidence_claim_key: online_quote_booking
    confidence_required: confirmed
    why_it_matters: Consultation forms and scheduling create an observable intake path.
    possible_hypothesis_ids:
      - first_response_follow_up
      - consultation_no_show
      - intake_completion
    score_rule_reference: module4c_lead_capture_plus1
  - signal_id: after_hours_language
    category: urgency
    evidence_claim_key: emergency_24_7_service
    confidence_required: confirmed
    why_it_matters: 24/7 or immediate-response language makes after-hours intake process worth testing.
    possible_hypothesis_ids:
      - after_hours_intake
    score_rule_reference: module4c_after_hours_plus1
  - signal_id: multiple_offices
    category: scale
    evidence_claim_key: multiple_locations
    confidence_required: confirmed
    why_it_matters: Multiple offices can increase intake routing, consistent follow-up and source reporting complexity.
    possible_hypothesis_ids:
      - intake_routing_consistency
      - retained_client_attribution
      - reporting_visibility
    score_rule_reference: module4c_multiple_locations_plus1
  - signal_id: visible_intake_hiring
    category: growth
    evidence_claim_key: visible_growth_hiring
    confidence_required: confirmed
    why_it_matters: Intake/admin hiring can indicate growth or capacity pressure worth investigating.
    possible_hypothesis_ids:
      - administrative_capacity
      - first_response_follow_up
    score_rule_reference: module4c_growth_plus1

customer_journey:
  - stage_id: need
    label: Legal need / problem
    common_inputs:
      - legal_issue
      - referral
      - event
    common_outputs:
      - search
      - call
      - referral_contact
    handoff_risks: []
    human_judgment_required: false
  - stage_id: acquisition
    label: Referral / Google / LSA / SEO / ad / social
    common_inputs:
      - google
      - LSA
      - referral
      - SEO
      - meta
    common_outputs:
      - call
      - email
      - form
      - chat
    handoff_risks:
      - attribution_loss
    human_judgment_required: false
  - stage_id: acknowledgment_intake
    label: Acknowledgment / intake
    common_inputs:
      - inquiry
    common_outputs:
      - intake_record
      - follow_up_task
      - consultation_candidate
    handoff_risks:
      - missed_call
      - slow_response
      - repeated_information
      - no_record
      - no_second_attempt
    human_judgment_required: true
  - stage_id: conflict_qualification
    label: Conflict / eligibility / qualification processes
    common_inputs:
      - intake_record
    common_outputs:
      - consultation
      - attorney_review
      - not_qualified
      - referred_out
    handoff_risks:
      - incomplete_intake
      - improper_automation_authority
    human_judgment_required: true
  - stage_id: consultation
    label: Consultation / attorney or qualified human review
    common_inputs:
      - qualified_or_reviewable_inquiry
    common_outputs:
      - retained
      - not_retained
      - future
      - referred
    handoff_risks:
      - no_show
      - weak_follow_up
      - no_next_action
    human_judgment_required: true
  - stage_id: matter_client
    label: Matter work / client communication
    common_inputs:
      - retained_client
    common_outputs:
      - client_service
      - matter_outcome
    handoff_risks:
      - repetitive_admin
      - document_workload
      - knowledge_search_load
    human_judgment_required: true
  - stage_id: attribution
    label: Retained-client / business outcome measurement
    common_inputs:
      - retained_client
    common_outputs:
      - source_reporting
      - firm_value_metric
    handoff_risks:
      - source_to_retained_gap
      - long_cycle_revenue_gap
    human_judgment_required: true

leak_hypotheses:
  - hypothesis_id: after_hours_intake
    category: after_hours
    title: Qualified potential-client inquiries may not receive useful after-hours handling
    description: After-hours callers may need prompt acknowledgment, basic approved intake and scheduling while legal judgment remains human.
    trigger_signals:
      - active_google_search_ads
      - after_hours_language
      - phone_heavy_site
    disqualifying_signals:
      - prospect_confirms_strong_measured_after_hours_intake
    public_fact_requirements:
      - current_paid_ad_evidence_if_referenced
    questions_to_verify:
      - What happens to a potential client who calls after intake has closed?
      - Can basic non-legal information be captured and routed without making legal judgments?
    primary_hook_template: What happens to a potential client who reaches out after intake has closed or does not answer the first callback?
    backup_hook_templates:
      - How quickly are after-hours inquiries reviewed by intake?
    offer_families:
      - ai_implementation
      - ai_growth_systems
    roi_tool_ids:
      - lead_response_roi
    must_not_claim:
      - caller_is_a_good_case
      - legal_qualification_by_ai
      - known_client_value
  - hypothesis_id: first_response_follow_up
    category: speed_to_lead
    title: Paid or web inquiries may lose momentum after the first contact attempt
    description: Intake teams may benefit from consistent acknowledgment, defined statuses, additional attempts and next-action dates.
    trigger_signals:
      - active_google_search_ads
      - active_meta_ads
      - consultation_cta
    disqualifying_signals:
      - prospect_confirms_strong_measured_intake_follow_up
    public_fact_requirements:
      - current_paid_ad_evidence_if_referenced
    questions_to_verify:
      - How many contact attempts occur after the first missed connection?
      - Can management see inquiries that have gone untouched for 24 hours?
    primary_hook_template: I noticed the firm is advertising around [practice area]. What happens if intake does not connect with that inquiry on the first attempt?
    backup_hook_templates:
      - How quickly does a paid-search inquiry receive a real response?
    offer_families:
      - ai_growth_systems
      - ai_implementation
    roi_tool_ids:
      - lead_response_roi
    must_not_claim:
      - paid_inquiries_are_being_lost
      - known_ad_spend
  - hypothesis_id: consultation_no_show
    category: appointment_no_show
    title: Consultation no-shows and reschedules may lack a defined recovery workflow
    description: Consultation capacity can be protected with reminders, easy rescheduling and appropriate human follow-up.
    trigger_signals:
      - consultation_cta
      - online_scheduling
    disqualifying_signals:
      - prospect_confirms_high_show_rate_and_strong_recovery
    public_fact_requirements: []
    questions_to_verify:
      - What percentage of scheduled consultations occur?
      - What happens after a no-show or reschedule request?
    primary_hook_template: What happens after a scheduled consultation no-shows or needs to reschedule?
    backup_hook_templates:
      - How are no-show consultations followed up?
    offer_families:
      - ai_implementation
    roi_tool_ids:
      - no_show_roi
    must_not_claim:
      - known_no_show_rate_without_firm_data
  - hypothesis_id: retained_client_attribution
    category: attribution
    title: Marketing source may not tie through qualified and retained-client status
    description: Legal acquisition should be measured beyond raw leads, with practice-area-appropriate value metrics and long-cycle caution.
    trigger_signals:
      - active_google_search_ads
      - active_meta_ads
      - call_tracking_signal
      - multiple_offices
    disqualifying_signals:
      - prospect_confirms_reliable_retained_client_attribution
    public_fact_requirements: []
    questions_to_verify:
      - Which campaigns produce retained clients rather than just inquiries?
      - Can phone/form source be tied through consultation and retained-client status?
    primary_hook_template: Can you trace your paid campaigns from the original inquiry through consultation and retained-client status?
    backup_hook_templates:
      - Do you know cost per retained client or mainly cost per lead?
    offer_families:
      - ai_growth_systems
      - ai_implementation
    roi_tool_ids:
      - advertising_efficiency_roi
    must_not_claim:
      - case_value_is_known
      - ad_campaign_is_unprofitable
  - hypothesis_id: administrative_capacity
    category: employee_capacity
    title: Intake and administrative staff may be carrying repetitive non-legal work
    description: Scheduling, reminders, intake summaries, CRM notes, document requests, internal search and reporting can consume time without requiring legal judgment.
    trigger_signals:
      - visible_intake_hiring
      - multiple_offices
      - high_intake_signal
    disqualifying_signals: []
    public_fact_requirements: []
    questions_to_verify:
      - Which repetitive administrative work consumes the most intake or paralegal time without requiring legal judgment?
      - If your best intake employee got five hours back each week, where would you want that time spent?
    primary_hook_template: What repetitive administrative work consumes the most intake time without requiring legal judgment?
    backup_hook_templates:
      - Where is information entered more than once during intake?
    offer_families:
      - ai_implementation
      - managed_ai_department
    roi_tool_ids:
      - employee_capacity_roi
    must_not_claim:
      - attorneys_or_staff_should_be_replaced
  - hypothesis_id: ai_governance
    category: governance
    title: Existing employee AI use may need approved tools, data rules and verification policy
    description: Firms may already have staff using AI without a consistent policy, creating governance and confidentiality questions.
    trigger_signals:
      - explicit_ai_usage_signal
      - ai_job_posting_signal
      - prospect_mentions_ai_use
    disqualifying_signals:
      - mature_governance_program_confirmed
    public_fact_requirements: []
    questions_to_verify:
      - Which AI tools are employees currently using?
      - What information can employees enter and what verification rules apply?
    primary_hook_template: Do you know which AI tools employees are already using and what information is allowed to go into them?
    backup_hook_templates:
      - Who owns AI policy and vendor approval at the firm?
    offer_families:
      - executive_ai_strategy
      - ai_training
      - managed_ai_department
    roi_tool_ids: []
    must_not_claim:
      - current_AI_use_is_unethical
      - YAD_can_certify_ethics_compliance

