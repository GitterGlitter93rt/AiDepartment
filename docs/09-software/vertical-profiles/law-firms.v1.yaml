      intent_weight: 5
      priority: 2
      recommended_for_paid_serp: true
      recommended_for_places_gap_fill: true
    - query: divorce lawyer
      family: family_law
      intent_weight: 5
      priority: 1
      recommended_for_paid_serp: true
      recommended_for_places_gap_fill: true
    - query: employment lawyer
      family: employment
      intent_weight: 5
      priority: 2
      recommended_for_paid_serp: true
      recommended_for_places_gap_fill: true
    - query: estate planning lawyer
      family: estate_planning
      intent_weight: 4
      priority: 2
      recommended_for_paid_serp: true
      recommended_for_places_gap_fill: true
    - query: immigration lawyer
      family: immigration
      intent_weight: 5
      priority: 2
      recommended_for_paid_serp: true
      recommended_for_places_gap_fill: true
