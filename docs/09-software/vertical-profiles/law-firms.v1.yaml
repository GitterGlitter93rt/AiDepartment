system_families:
  - system_family_id: legal_crm_intake
    names:
      - Clio
      - Filevine
      - Lawyaw
    category: legal_intake_CRM_practice_management
    frontend_detection_terms:
      - clio
      - filevine
      - lawyaw
    positioning_rule: A legal platform signal proves only the system/feature signal observed; it does not prove intake, follow-up, attribution, data governance or employee adoption are configured well.
    questions:
      - Does every inquiry enter the system?
      - What happens after first no-response?
      - Can retained-client source be reported?
  - system_family_id: phone_system
    names: []
    category: telephony
    frontend_detection_terms:
      - call tracking
    positioning_rule: Phone-system presence does not prove after-hours intake or source-to-retained-client attribution.
    questions:
      - What happens after hours and after a missed intake call?
  - system_family_id: scheduling
    names: []
    category: consultation_scheduling
    frontend_detection_terms:
      - book consultation
      - schedule consultation
    positioning_rule: Online scheduling does not prove reminders/no-show recovery or qualification boundaries are configured.
    questions:
      - What happens after a consultation no-show?

hook_priorities:
