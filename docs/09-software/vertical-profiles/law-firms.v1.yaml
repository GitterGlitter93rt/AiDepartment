    base_priority: 10
    boost_if_signals:
      - active_google_search_ads
      - after_hours_language
      - phone_heavy_site
    demote_if_signals: []
    avoid_if:
      - prospect_confirms_strong_after_hours_process
    question_templates:
      - What happens to a potential client after intake has closed?
  - hook_family: first_response_follow_up
    base_priority: 9
    boost_if_signals:
      - active_google_search_ads
      - active_meta_ads
      - consultation_cta
    demote_if_signals: []
    avoid_if:
      - strong_intake_follow_up_confirmed
    question_templates:
      - What happens if intake does not connect on the first attempt?
  - hook_family: attribution
    base_priority: 9
    boost_if_signals:
      - active_google_search_ads
      - call_tracking_signal
      - multiple_offices
    demote_if_signals: []
    avoid_if:
      - reliable_retained_client_attribution_confirmed
    question_templates:
      - Can you trace paid inquiries through retained-client status?
  - hook_family: administrative_capacity
    base_priority: 7
    boost_if_signals:
      - visible_intake_hiring
      - multiple_offices
    demote_if_signals: []
    avoid_if: []
    question_templates:
      - Which repetitive intake task consumes the most time without requiring legal judgment?
  - hook_family: ai_governance
    base_priority: 6
    boost_if_signals:
      - explicit_ai_usage_signal
      - prospect_mentions_ai_use
    demote_if_signals: []
    avoid_if:
      - mature_governance_program_confirmed
    question_templates:
      - Which AI tools are employees using and what data rules apply?

discovery_question_banks:
  lead_generation:
    - text: Which practice areas and channels drive growth?
      purpose: economics and source mix
    - text: Are Google, LSA or Meta campaigns active, and which retained-client metrics are used?
      purpose: acquisition measurement
  phone_after_hours:
    - text: What happens to a potential client after intake has closed?
      purpose: after-hours process
    - text: How many contact attempts occur after the first missed connection?
      purpose: follow-up
  scheduling_dispatch:
    - text: How are consultations scheduled, reminded and recovered after no-shows?
      purpose: consultation utilization
  sales_follow_up:
    - text: What happens to a legitimate prospect who says call me next week?
      purpose: next-action discipline
  retention_reactivation:
    - text: Which inquiry statuses are appropriate for future follow-up rather than immediate closure?
      purpose: pipeline lifecycle
  employee_capacity:
    - text: Which repetitive administrative tasks consume intake, paralegal or staff time without legal judgment?
      purpose: capacity
  reporting:
    - text: Can leadership see inquiries, qualified consultations and retained clients by source?
      purpose: reporting
  systems_crm:
    - text: Where does the potential-client record begin and does every inquiry enter it?
      purpose: intake architecture
  attribution:
    - text: Can phone and form source be tied to retained-client status using a defensible practice-area metric?
      purpose: closed-loop attribution
  technical_constraints:
    - text: What should absolutely remain under attorney or qualified staff control?
      purpose: professional boundary
    - text: What are the firm's approved AI tools, data-handling and verification rules?
      purpose: governance

offer_mapping:
  - opportunity_category: after_hours
    possible_offer_families:
      - ai_implementation
      - ai_growth_systems
    positioning: Support non-legal intake capture, routing, scheduling and human escalation without making legal judgments.
    required_discovery_before_recommending:
      - approved_intake_fields
      - qualification_boundaries
      - conflict_process
      - scheduling_rules
      - confidentiality_requirements
    do_not_recommend_if:
      - firm_requests_unsupervised_legal_judgment
  - opportunity_category: speed_to_lead
    possible_offer_families:
      - ai_growth_systems
      - ai_implementation
    positioning: Improve acknowledgment, intake statuses, next-action discipline and human follow-up around paid demand.
    required_discovery_before_recommending:
      - intake_volume
      - response_process
      - contact_attempt_policy
    do_not_recommend_if:
      - intake_follow_up_already_strong
  - opportunity_category: attribution
    possible_offer_families:
      - ai_growth_systems
      - ai_implementation
    positioning: Connect source through inquiry, qualification, consultation and retained-client status using firm-approved economics.
    required_discovery_before_recommending:
      - practice_area
      - fee_model
      - attribution_systems
      - firm_value_metric
    do_not_recommend_if:
      - attribution_already_reliable
  - opportunity_category: employee_capacity
    possible_offer_families:
      - ai_implementation
      - managed_ai_department
    positioning: Automate repetitive administrative work around attorneys and staff while confidentiality and legal judgment remain human.
    required_discovery_before_recommending:
      - task_frequency
      - data_sensitivity
      - approved_tools
      - human_review
    do_not_recommend_if:
      - confidentiality_requirements_cannot_be_met
  - opportunity_category: governance
    possible_offer_families:
      - executive_ai_strategy
      - ai_training
      - managed_ai_department
    positioning: Help the firm evaluate tools, data rules, training and governed workflows in coordination with its own legal/ethics authorities.
    required_discovery_before_recommending:
      - current_AI_use
      - approved_tools
      - confidentiality_policy
      - governance_owner
    do_not_recommend_if:
      - firm_expects_YAD_to_provide_legal_ethics_opinion

roi_tools:
