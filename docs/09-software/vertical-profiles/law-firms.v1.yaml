practice_area_taxonomy:
  supported_initial:
    - personal_injury
    - criminal_defense
    - family_law
    - employment
    - immigration
    - estate_planning
    - business_law
    - bankruptcy
    - real_estate_law
    - mass_tort_complex_litigation
    - other_specialty
  rule: Practice area materially changes economics, urgency, qualification, fee model and advertising behavior. Never transfer economic assumptions from one practice area to another.

business_model:
  revenue_categories:
    - contingency_fee_matters
    - hourly_matters
    - flat_fee_matters
    - retainer_or_other_fee_arrangements
  lead_types:
    - paid_search_inquiry
    - local_services_inquiry
    - organic_search_inquiry
    - referral
    - website_form
    - inbound_call
    - email_inquiry
    - chat_inquiry
    - meta_lead
  customer_types:
    - prospective_client
    - existing_client
    - referral_source
  high_value_service_families:
    - practice_area_dependent_retained_client
    - contingency_case_where_applicable
    - complex_or_high_value_matter_where_applicable
  recurring_revenue_families:
    - ongoing_business_client_relationships_where_applicable
    - retainer_relationships_where_applicable
  urgency_characteristics:
    - arrest_or_criminal_matter
    - injury_or_accident
    - filing_or_deadline_sensitive_matter
    - family_crisis
    - time_sensitive_consultation
  seasonality_characteristics:
    - practice_area_dependent
  phone_dependence: high
  appointment_dependence: high
  estimate_proposal_dependence: low
  field_service_dependence: low

