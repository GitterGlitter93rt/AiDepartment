      - affected_percent
      - qualified_percent
      - conservative_conversion_scenario
      - customer_value_metric
    prohibited_shortcuts:
      - treating_every_delayed_lead_as_lost_sale
  - roi_tool_id: employee_capacity_roi
    name: Employee Capacity ROI
    relevant_hypothesis_ids:
