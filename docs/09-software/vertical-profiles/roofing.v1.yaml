discovery_question_banks:
  lead_generation:
    - text: Which lead sources create the most signed roofing jobs?
      purpose: source economics
    - text: How quickly are new paid or storm leads contacted?
      purpose: response process
  phone_after_hours:
    - text: What happens to after-hours roofing calls?
      purpose: overflow and recovery
  scheduling_dispatch:
    - text: How quickly can a qualified lead get an inspection appointment?
      purpose: inspection conversion
    - text: What happens when an inspection is rescheduled or missed?
      purpose: no-show recovery
  sales_follow_up:
    - text: How many proposals are still open after 30 days?
      purpose: open pipeline
    - text: Who owns the next action on every unsold proposal?
      purpose: follow-up ownership
  retention_reactivation:
    - text: How are old storm leads and unsold estimates reactivated?
      purpose: dormant pipeline
  employee_capacity:
    - text: What does the sales or office team repeat manually every week?
      purpose: capacity
  reporting:
    - text: Which pipeline or marketing report still requires manual work?
      purpose: reporting friction
  systems_crm:
    - text: Does every lead and proposal live in one visible pipeline?
      purpose: CRM completeness
  attribution:
    - text: Can you tie campaign source to signed contract and collected revenue?
      purpose: closed-loop measurement
  technical_constraints:
    - text: Which insurance, financing or production decisions must remain with qualified humans?
      purpose: boundary discovery

offer_mapping:
  - opportunity_category: unsold_estimate
    possible_offer_families:
      - ai_implementation
      - ai_growth_systems
    positioning: Improve the existing proposal pipeline, tasks, reminders, CRM visibility and appropriate follow-up before considering replacement software.
    required_discovery_before_recommending:
      - current_crm
      - proposal_volume
      - current_follow_up_process
      - communication_permissions
    do_not_recommend_if:
      - process_already_strong_and_measured
  - opportunity_category: speed_to_lead
    possible_offer_families:
      - ai_growth_systems
      - ai_implementation
    positioning: Improve capture, routing, response and next-action consistency around existing paid demand.
    required_discovery_before_recommending:
      - lead_sources
      - response_time
      - current_routing
    do_not_recommend_if:
      - response_process_already_strong
  - opportunity_category: attribution
    possible_offer_families:
      - ai_growth_systems
      - ai_implementation
    positioning: Connect lead source to inspections, proposals, signed contracts and revenue where technically feasible.
    required_discovery_before_recommending:
      - ad_platforms
      - CRM
      - accounting_or_revenue_source
    do_not_recommend_if:
      - closed_loop_attribution_already_reliable
  - opportunity_category: employee_capacity
    possible_offer_families:
      - ai_implementation
      - managed_ai_department
    positioning: Reduce repetitive admin around sales and office staff while preserving human roofing, sales, financing and insurance judgment.
    required_discovery_before_recommending:
      - task_frequency
      - employee_hours
      - system_constraints
    do_not_recommend_if:
      - economics_weak

