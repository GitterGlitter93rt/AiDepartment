      - leads
      - inspections
      - signed_jobs
      - revenue_metric
    prohibited_shortcuts:
      - guessing_ad_spend

objection_guidance:
  - objection_id: salespeople_already_follow_up
    match_phrases:
      - our salespeople follow up
    principle: Do not attack the team; test process consistency and visibility.
    response_guidance: Good. Ask whether the process is standardized and whether management can verify next actions on every open proposal.
    follow_up_questions:
      - Can you see untouched proposals and value by salesperson?
    must_not_say:
      - your reps are dropping leads
    manual_reference: module-12-roofing-industry-playbook.md#28-roofing-objections
  - objection_id: existing_crm
    match_phrases:
      - we already have a CRM
    principle: Existing software is positive if it works.
    response_guidance: Ask whether it shows stale proposals, next actions, source and signed revenue.
    follow_up_questions:
      - Can it show every proposal untouched for seven days and its value?
    must_not_say:
      - you need a new CRM
    manual_reference: module-12-roofing-industry-playbook.md#28-roofing-objections
  - objection_id: marketing_agency
    match_phrases:
      - we have an agency
    principle: Do not attack the agency.
    response_guidance: Focus on what happens after demand is created and whether it can be tied to sold revenue.
    follow_up_questions:
      - Can you trace the agency lead to inspection, proposal and signed job?
    must_not_say:
      - your agency is wasting money
    manual_reference: module-12-roofing-industry-playbook.md#28-roofing-objections
  - objection_id: storm_leads_are_different
    match_phrases:
      - storm leads are different
    principle: Map the surge workflow rather than forcing a generic model.
    response_guidance: Agree that storm behavior differs and ask which parts of the operating system are repeatable.
    follow_up_questions:
      - Which storm-launch steps are rebuilt every time?
    must_not_say: []
    manual_reference: module-12-roofing-industry-playbook.md#28-roofing-objections

safety_boundaries:
  - boundary_id: insurance_adjusting
    category: insurance_legal
    prohibited_agent_claims:
      - insurance_coverage_decision
      - legal_interpretation
      - unauthorized_public_adjusting
      - guaranteed_claim_outcome
    human_required_for:
      - claim_specific_advice
      - coverage_questions
      - authorized_adjusting_decisions
    escalation_guidance: Route claim-specific, coverage, legal and adjusting questions to appropriately authorized humans.
  - boundary_id: financing
    category: financial
    prohibited_agent_claims:
      - loan_approval
      - guaranteed_financing
    human_required_for:
      - financing_approval
      - lender_specific_decisions
    escalation_guidance: Use approved lender processes and human oversight.
  - boundary_id: roofing_technical
    category: safety_technical
    prohibited_agent_claims:
      - roof_is_safe
      - structural_diagnosis
