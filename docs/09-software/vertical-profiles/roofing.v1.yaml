    question_templates:
      - What happens to a roofing proposal that does not sign the first time?
  - hook_family: paid_lead_response
    base_priority: 9
    boost_if_signals:
      - active_google_search_ads
      - active_meta_ads
      - storm_market_signal
    demote_if_signals: []
    avoid_if:
      - no_current_ad_evidence_when_ad_reference_required
    question_templates:
      - What happens if a paid roofing lead does not answer the first callback?
  - hook_family: storm_surge
    base_priority: 8
    boost_if_signals:
      - storm_market_signal
      - multiple_markets
    demote_if_signals: []
    avoid_if: []
    question_templates:
      - When storm volume spikes, what breaks first?
  - hook_family: attribution
    base_priority: 8
    boost_if_signals:
      - active_google_search_ads
      - active_meta_ads
      - call_tracking_signal
    demote_if_signals: []
    avoid_if:
      - prospect_confirms_closed_loop_attribution
    question_templates:
      - Can you trace a paid lead through to a signed roof and revenue?
  - hook_family: employee_capacity
    base_priority: 6
    boost_if_signals:
      - visible_hiring
      - multiple_locations
    demote_if_signals: []
    avoid_if: []
    question_templates:
