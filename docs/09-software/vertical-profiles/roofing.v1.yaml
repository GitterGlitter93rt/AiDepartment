      - roof_age
      - leak
      - planned_replacement
    common_outputs:
      - search
      - ad_response
      - referral
      - canvass
    handoff_risks: []
    human_judgment_required: false
  - stage_id: acquisition
    label: Search / ad / referral / canvass
    common_inputs:
      - google
      - meta
      - referral
      - canvass
    common_outputs:
      - call
      - form
      - inspection_request
    handoff_risks:
      - attribution_loss
    human_judgment_required: false
  - stage_id: lead_response
    label: Response / qualification
    common_inputs:
      - call
      - form
      - field_lead
    common_outputs:
      - qualified_lead
      - inspection_request
    handoff_risks:
      - slow_response
      - missed_call
      - no_owner
      - no_second_attempt
    human_judgment_required: true
  - stage_id: inspection
