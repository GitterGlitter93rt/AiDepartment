public_signal_rules:
  - signal_id: active_google_search_ads
    category: paid_acquisition
    evidence_claim_key: active_google_search_ad
    confidence_required: confirmed
    why_it_matters: Paid roofing demand makes lead response, inspection scheduling, proposal follow-up and attribution worth investigating.
    possible_hypothesis_ids:
      - paid_lead_response
      - no_response_follow_up
      - attribution_gap
    score_rule_reference: module4c_google_ads_plus4
  - signal_id: active_meta_ads
    category: paid_acquisition
    evidence_claim_key: active_meta_ad
    confidence_required: confirmed
    why_it_matters: Meta campaigns can create form-driven roofing leads that require fast routing and follow-up.
    possible_hypothesis_ids:
      - speed_to_lead
      - inspection_booking
      - attribution_gap
    score_rule_reference: module4c_meta_ads_plus3
  - signal_id: storm_market_signal
    category: urgency
    evidence_claim_key: storm_hail_market_signal
    confidence_required: confirmed
    why_it_matters: Storm surges create temporary lead-volume and routing pressure.
    possible_hypothesis_ids:
      - storm_surge_capacity
      - speed_to_lead
      - lead_assignment
    score_rule_reference: vertical_priority_signal_only
  - signal_id: financing_promoted
    category: sales_follow_up
    evidence_claim_key: financing_promoted
    confidence_required: confirmed
    why_it_matters: Financing can make proposal follow-up and customer next-action tracking more important.
    possible_hypothesis_ids:
      - unsold_proposal_follow_up
      - financing_follow_up
    score_rule_reference: vertical_priority_signal_only
  - signal_id: multiple_locations
    category: scale
    evidence_claim_key: multiple_locations
    confidence_required: confirmed
    why_it_matters: Multi-market operations increase routing, pipeline consistency and reporting complexity.
    possible_hypothesis_ids:
      - multi_market_consistency
      - attribution_gap
      - reporting_visibility
    score_rule_reference: module4c_multiple_locations_plus1
  - signal_id: inspection_quote_cta
    category: lead_capture
    evidence_claim_key: online_quote_booking
    confidence_required: confirmed
    why_it_matters: A visible inspection or quote path creates a measurable lead-entry workflow.
    possible_hypothesis_ids:
      - inspection_booking
      - speed_to_lead
      - crm_capture
    score_rule_reference: module4c_lead_capture_plus1
  - signal_id: visible_hiring
    category: growth
    evidence_claim_key: visible_growth_hiring
    confidence_required: confirmed
    why_it_matters: Growth and sales/admin hiring can make capacity and standardization questions more relevant.
    possible_hypothesis_ids:
      - employee_sales_capacity
      - multi_market_consistency
    score_rule_reference: module4c_growth_plus1

customer_journey:
