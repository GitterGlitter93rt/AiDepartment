leak_hypotheses:
  - hypothesis_id: unsold_proposal_follow_up
    category: unsold_estimate
    title: Unsold proposal follow-up may be inconsistent
    description: High-value proposals can become stale when next actions depend primarily on salesperson memory.
    trigger_signals:
      - replacement_focus
      - inspection_quote_cta
      - financing_promoted
      - sales_team_signal
    disqualifying_signals:
      - prospect_confirms_strong_measured_follow_up
    public_fact_requirements: []
    questions_to_verify:
      - What happens to a proposal that does not sign during the first presentation?
      - Can management see every open proposal with its next action and value?
    primary_hook_template: What happens to a roofing proposal that does not sign during the first conversation?
    backup_hook_templates:
      - Who owns proposal follow-up after day seven?
      - Can management see stale proposal value by salesperson?
    offer_families:
      - ai_implementation
      - ai_growth_systems
    roi_tool_ids:
      - unsold_estimate_follow_up_roi
    must_not_claim:
      - every_open_proposal_is_recoverable
      - automation_will_raise_close_rate_by_specific_percent
  - hypothesis_id: paid_lead_response
    category: speed_to_lead
    title: Paid roofing leads may lose momentum after acquisition
    description: Active advertisers may benefit from measuring first response, routing and second-attempt behavior.
    trigger_signals:
      - active_google_search_ads
      - active_meta_ads
    disqualifying_signals:
      - prospect_confirms_strong_measured_response_process
    public_fact_requirements:
      - current_paid_ad_evidence_if_referenced
    questions_to_verify:
      - How quickly does a new paid roofing lead hear from somebody?
      - What happens if nobody reaches the homeowner on the first attempt?
    primary_hook_template: I noticed you are advertising around [service] in [market]. What happens if that lead does not answer the first callback?
    backup_hook_templates:
      - Can you trace that campaign through inspection and signed job?
    offer_families:
      - ai_growth_systems
      - ai_implementation
    roi_tool_ids:
      - lead_response_roi
    must_not_claim:
      - known_ad_spend
      - paid_leads_are_being_lost
  - hypothesis_id: storm_surge_capacity
    category: employee_capacity
    title: Storm surges may overwhelm normal lead and office capacity
    description: A storm can create temporary lead volume that exceeds ordinary phone, routing and follow-up capacity.
    trigger_signals:
      - storm_market_signal
      - storm_landing_page
      - hail_wind_offer
    disqualifying_signals:
      - prospect_confirms_strong_surge_playbook
    public_fact_requirements: []
    questions_to_verify:
      - When normal lead volume becomes several times larger after a storm, what breaks first?
      - How are leads assigned and followed up during the surge?
    primary_hook_template: When a storm spikes lead volume, what part of the office or sales process gets overloaded first?
    backup_hook_templates:
      - What does your team rebuild manually every time you enter a storm market?
    offer_families:
      - ai_implementation
      - ai_growth_systems
    roi_tool_ids:
      - lead_response_roi
      - employee_capacity_roi
    must_not_claim:
      - storm_leads_are_currently_being_lost
  - hypothesis_id: attribution_gap
    category: attribution
    title: Marketing may not be tied through signed roofing revenue
    description: Ad platforms can report leads while the contractor needs visibility through inspection, proposal, signed contract and collected revenue.
    trigger_signals:
      - active_google_search_ads
      - active_meta_ads
      - call_tracking_signal
    disqualifying_signals:
      - prospect_confirms_closed_loop_attribution
    public_fact_requirements: []
    questions_to_verify:
      - Can you trace a paid lead through to a signed roof and collected revenue?
      - Do you know cost per inspection and sold job or mainly cost per lead?
    primary_hook_template: Can you trace your paid campaigns all the way to signed roofing jobs?
    backup_hook_templates:
      - Which source creates the best sold jobs rather than the most leads?
    offer_families:
      - ai_growth_systems
      - ai_implementation
    roi_tool_ids:
      - advertising_efficiency_roi
    must_not_claim:
      - attribution_is_broken
  - hypothesis_id: employee_sales_capacity
    category: employee_capacity
    title: Sales and office staff may be carrying repetitive administrative work
    description: Follow-up, CRM notes, documents, status messages and reporting can consume time that does not require selling or roofing judgment.
    trigger_signals:
      - visible_hiring
      - multiple_locations
      - high_sales_team_signal
    disqualifying_signals: []
    public_fact_requirements: []
    questions_to_verify:
      - What does your best salesperson spend time doing that does not require selling ability?
      - Which customer or document workflow repeats most often?
    primary_hook_template: What administrative work keeps your best salespeople from selling?
    backup_hook_templates:
      - If lead volume doubled, where would office capacity break first?
    offer_families:
      - ai_implementation
      - managed_ai_department
    roi_tool_ids:
      - employee_capacity_roi
    must_not_claim:
      - staff_should_be_replaced

