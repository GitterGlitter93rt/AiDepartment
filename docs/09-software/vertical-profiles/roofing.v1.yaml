system_families:
  - system_family_id: roofing_crm
    names: []
    category: crm_sales_pipeline
    frontend_detection_terms: []
    positioning_rule: A detected CRM is evidence of a system, not proof that lead routing, follow-up, attribution or salesperson usage are configured well.
    questions:
      - Does every lead and proposal live in the system?
      - Can management see stale proposals by value and next action?
  - system_family_id: call_tracking
    names: []
    category: call_attribution
    frontend_detection_terms:
      - call tracking
    positioning_rule: Call-tracking presence does not prove source-to-signed-job attribution.
    questions:
      - Can the call source be tied through to the signed job?
  - system_family_id: scheduling
    names: []
    category: inspection_scheduling
    frontend_detection_terms:
      - schedule inspection
      - book inspection
    positioning_rule: A scheduling widget does not prove no-show and reschedule follow-up are automated.
    questions:
      - What happens after a reschedule or no-show?

