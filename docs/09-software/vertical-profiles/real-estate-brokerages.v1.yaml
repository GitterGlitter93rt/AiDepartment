    - no_buyer_seller_service_evidence
  manual_review_if:
    - property_management_mix_unclear
    - individual_agent_vs_team_unclear
    - portal_or_lead_generator_possible
    - brokerage_brand_franchise_relationship_ambiguous

public_signal_rules:
  - signal_id: active_google_search_ads
    category: paid_acquisition
    evidence_claim_key: active_google_search_ad
    confidence_required: confirmed
    why_it_matters: Paid buyer/seller acquisition makes speed-to-lead, long-term nurture, routing and source-to-close attribution relevant.
    possible_hypothesis_ids:
      - speed_to_lead
      - long_term_nurture
      - source_to_close_attribution
    score_rule_reference: module4c_google_ads_plus4
  - signal_id: active_meta_ads
    category: paid_acquisition
    evidence_claim_key: active_meta_ad
    confidence_required: confirmed
    why_it_matters: Meta lead forms, listing ads and seller campaigns often require rapid routing and structured nurture.
    possible_hypothesis_ids:
      - speed_to_lead
      - long_term_nurture
      - seller_follow_up
    score_rule_reference: module4c_meta_ads_plus3
  - signal_id: online_lead_capture
    category: lead_capture
    evidence_claim_key: online_quote_booking
    confidence_required: confirmed
    why_it_matters: Home-value forms, showing requests, contact forms and consultation CTAs create visible lead-entry paths.
    possible_hypothesis_ids:
      - speed_to_lead
      - long_term_nurture
      - CRM_capture
    score_rule_reference: module4c_lead_capture_plus1
  - signal_id: multiple_offices
    category: scale
    evidence_claim_key: multiple_locations
    confidence_required: confirmed
    why_it_matters: Multiple offices or teams increase routing, CRM consistency and reporting complexity.
    possible_hypothesis_ids:
      - agent_routing
      - source_to_close_attribution
      - reporting_visibility
    score_rule_reference: module4c_multiple_locations_plus1
  - signal_id: visible_hiring
    category: growth
    evidence_claim_key: visible_growth_hiring
    confidence_required: confirmed
    why_it_matters: Agent, ISA or operations hiring can make lead-management capacity and standardization more relevant.
    possible_hypothesis_ids:
      - agent_capacity
      - agent_routing
    score_rule_reference: module4c_growth_plus1
  - signal_id: open_house_or_listing_activity
    category: pipeline
    evidence_claim_key: open_house_listing_signal
    confidence_required: likely
    why_it_matters: Active listing/open-house workflows can create lead capture and nurture opportunities.
    possible_hypothesis_ids:
      - open_house_capture
      - long_term_nurture
    score_rule_reference: vertical_priority_signal_only

customer_journey:
  - stage_id: demand
    label: Buyer / seller interest
    common_inputs:
      - buyer_interest
      - seller_interest
      - referral
      - open_house
    common_outputs:
      - search
      - portal
      - ad
      - referral_contact
    handoff_risks: []
    human_judgment_required: false
  - stage_id: acquisition
    label: Portal / ad / search / referral / open house
    common_inputs:
      - portal
      - google
      - meta
      - referral
      - open_house
    common_outputs:
      - lead
    handoff_risks:
      - attribution_loss
    human_judgment_required: false
  - stage_id: response_routing
    label: Agent / ISA response and routing
    common_inputs:
      - lead
    common_outputs:
      - conversation
      - appointment
      - nurture
    handoff_risks:
      - slow_response
      - no_owner
      - inconsistent_routing
      - no_second_attempt
    human_judgment_required: true
  - stage_id: qualification_nurture
    label: Qualification / future timing / nurture
    common_inputs:
      - conversation
    common_outputs:
      - appointment
      - long_term_nurture
      - disqualified
    handoff_risks:
      - future_lead_forgotten
      - weak_next_action
      - CRM_nonuse
    human_judgment_required: true
  - stage_id: relationship
    label: Showing / listing consult / client relationship
    common_inputs:
      - appointment
      - nurtured_lead
    common_outputs:
      - client_relationship
    handoff_risks:
      - admin_capacity
      - follow_up_gap
    human_judgment_required: true
  - stage_id: transaction
    label: Transaction / close
    common_inputs:
      - client_relationship
    common_outputs:
      - closed_transaction
    handoff_risks:
      - source_lost
      - transaction_admin_load
    human_judgment_required: true
  - stage_id: database
    label: Review / referral / database
    common_inputs:
      - closed_transaction
      - past_lead
    common_outputs:
      - referral
      - repeat_relationship
      - reactivation
    handoff_risks:
      - database_nurture_gap
    human_judgment_required: false

leak_hypotheses:
  - hypothesis_id: speed_to_lead
    category: speed_to_lead
    title: Internet leads may not receive a fast consistent human response
    description: Portal, Meta and website leads can arrive while agents are driving, showing property or in appointments.
    trigger_signals:
      - active_google_search_ads
      - active_meta_ads
      - online_lead_capture
    disqualifying_signals:
      - prospect_confirms_strong_measured_response_process
    public_fact_requirements:
      - current_paid_ad_evidence_if_referenced
    questions_to_verify:
      - How quickly does a brand-new internet lead get a real response?
      - What happens after the first unanswered call or text?
    primary_hook_template: I noticed your team is actively advertising in [market]. How quickly does a brand-new internet lead get a real response when the assigned agent is busy?
    backup_hook_templates:
      - What happens after the first unanswered contact attempt?
    offer_families:
      - ai_growth_systems
      - ai_implementation
    roi_tool_ids:
      - lead_response_roi
    must_not_claim:
      - first_responder_always_wins
      - known_lead_loss_rate
      - known_ad_spend
  - hypothesis_id: long_term_nurture
    category: follow_up
    title: Legitimate future buyers and sellers may fall out of consistent nurture
    description: Real estate cycles can be months long, making timing, status and next-action discipline important.
    trigger_signals:
      - active_meta_ads
      - portal_leads
      - online_lead_capture
      - large_team_signal
    disqualifying_signals:
      - prospect_confirms_strong_CRM_nurture_and_reporting
    public_fact_requirements: []
    questions_to_verify:
      - What happens to a good buyer or seller lead who says they are six months away?
      - Can management see long-term leads with a real next action by agent?
    primary_hook_template: What happens to a good buyer or seller lead that says they are six months away?
    backup_hook_templates:
      - How does the CRM keep that relationship alive without relying on the agent remembering?
    offer_families:
      - ai_implementation
      - ai_growth_systems
    roi_tool_ids:
      - lead_response_roi
      - lead_reactivation_roi
    must_not_claim:
      - every_old_lead_will_transact
  - hypothesis_id: seller_follow_up
    category: follow_up
    title: Future seller inquiries may lack structured next steps
    description: Home-value and listing inquiries may be valuable long before the homeowner is ready to sign a listing agreement.
    trigger_signals:
      - seller_campaign_signal
      - home_value_CTA
      - active_meta_ads
    disqualifying_signals:
      - strong_seller_nurture_confirmed
    public_fact_requirements: []
    questions_to_verify:
      - What happens to a homeowner who is curious about selling but not ready today?
      - How is future listing timing recorded and revisited?
    primary_hook_template: What happens to a seller lead who is interested but not ready to list today?
    backup_hook_templates:
      - How does the team know exactly when to re-engage that homeowner?
    offer_families:
      - ai_growth_systems
      - ai_implementation
    roi_tool_ids:
      - lead_reactivation_roi
    must_not_claim:
      - every_home_value_lead_is_a_listing
  - hypothesis_id: agent_routing
    category: CRM_workflow
    title: Lead routing and ownership may become inconsistent across agents, offices or lead types
    description: Geography, lead type, price segment, language, availability and round-robin rules can create routing complexity.
    trigger_signals:
      - multiple_offices
      - large_team_signal
      - portal_leads
    disqualifying_signals:
      - prospect_confirms_strong_routing_and_visibility
    public_fact_requirements: []
    questions_to_verify:
      - How are new leads assigned and what happens if the assigned agent does not respond?
      - Can management see stale leads by agent?
    primary_hook_template: How are leads assigned, and what happens if the assigned agent is unavailable or does not respond?
    backup_hook_templates:
      - Can management see untouched leads by agent and source?
    offer_families:
      - ai_implementation
      - managed_ai_department
    roi_tool_ids:
      - lead_response_roi
    must_not_claim:
      - routing_is_discriminatory
  - hypothesis_id: source_to_close_attribution
    category: attribution
    title: Lead source may not tie cleanly through client and closing
    description: Ad/portal/source performance should be evaluated by appointments, clients and closed transactions rather than raw leads alone.
    trigger_signals:
      - active_google_search_ads
      - active_meta_ads
      - portal_leads
      - multiple_offices
    disqualifying_signals:
      - prospect_confirms_closed_loop_source_to_close_reporting
    public_fact_requirements: []
    questions_to_verify:
      - Which lead source actually creates closings, not just names in the CRM?
      - Can closed transaction be tied back to original lead source?
    primary_hook_template: Can you trace your paid and portal leads all the way through to closed transactions?
    backup_hook_templates:
      - Which source creates the best actual clients rather than the most leads?
    offer_families:
      - ai_growth_systems
      - ai_implementation
    roi_tool_ids:
      - advertising_efficiency_roi
    must_not_claim:
      - source_is_unprofitable_without_data
  - hypothesis_id: agent_capacity
    category: employee_capacity
    title: Agents or ISA staff may spend meaningful time on repetitive administrative work
    description: CRM notes, reminders, drafting, open-house follow-up, tagging and summaries can take time from client relationships.
    trigger_signals:
      - visible_hiring
      - large_team_signal
      - multiple_offices
    disqualifying_signals: []
    public_fact_requirements: []
    questions_to_verify:
      - What administrative work keeps your best agents or ISA team from talking to clients?
      - Where is lead data entered more than once?
    primary_hook_template: What administrative work keeps your best agents from talking to clients and showing or listing property?
    backup_hook_templates:
      - Which CRM task is most likely to get skipped when agents are busy?
    offer_families:
      - ai_implementation
      - managed_ai_department
    roi_tool_ids:
      - employee_capacity_roi
    must_not_claim:
      - agents_should_be_replaced

