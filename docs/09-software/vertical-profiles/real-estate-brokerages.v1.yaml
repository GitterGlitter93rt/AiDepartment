    - real_estate_brokerage
    - residential_real_estate_team
    - realtor_office
    - real_estate_agent_team
  negative_business_categories:
    - real_estate_school
    - property_portal
    - title_company
    - mortgage_lender
  website_keyword_positive:
    - homes for sale
    - sell your home
    - home valuation
    - schedule showing
    - meet our agents
    - buyer consultation
    - listing consultation
  website_keyword_negative:
    - real estate classes
    - title services only
    - mortgage only
  required_any_of:
    - real_estate_sales_service_evidence
    - buyer_or_seller_service_evidence
