system_families:
  - system_family_id: real_estate_CRM
    names: []
    category: CRM_lead_nurture
    frontend_detection_terms: []
    positioning_rule: CRM presence does not prove consistent agent use, future-timing nurture, routing or source-to-close reporting.
    questions:
      - Does every portal, web and open-house lead enter the CRM?
      - Can management see future-timing and stale leads by agent?
  - system_family_id: portal_lead_sources
    names: []
    category: lead_provider
    frontend_detection_terms: []
    positioning_rule: Portal presence shows a lead source, not the response or nurture quality after delivery.
    questions:
      - What happens when a portal lead arrives while the assigned agent is busy?
  - system_family_id: scheduling
    names: []
    category: appointments_showings
    frontend_detection_terms:
      - schedule showing
      - book consultation
    positioning_rule: Scheduling availability does not prove reminders, no-show handling or lead routing are consistent.
    questions:
      - What happens if a prospect reschedules or stops responding?

