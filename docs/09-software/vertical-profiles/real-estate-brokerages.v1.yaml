    question_templates:
      - What happens to a good lead that is six months away?
  - hook_family: speed_to_lead
    base_priority: 9
    boost_if_signals:
      - active_google_search_ads
      - active_meta_ads
      - online_lead_capture
    demote_if_signals: []
    avoid_if:
      - strong_response_process_confirmed
    question_templates:
      - How quickly does a new internet lead get a real response?
  - hook_family: seller_follow_up
    base_priority: 9
    boost_if_signals:
      - home_value_CTA
      - seller_campaign_signal
    demote_if_signals: []
    avoid_if:
      - no_seller_lead_focus
    question_templates:
      - What happens to a homeowner who is not ready to list today?
  - hook_family: attribution
    base_priority: 8
    boost_if_signals:
      - active_google_search_ads
      - active_meta_ads
      - portal_leads
    demote_if_signals: []
    avoid_if:
      - reliable_source_to_close_attribution_confirmed
    question_templates:
      - Can you trace paid and portal leads through to closings?
  - hook_family: agent_capacity
    base_priority: 7
    boost_if_signals:
      - visible_hiring
      - multiple_offices
      - large_team_signal
    demote_if_signals: []
    avoid_if: []
    question_templates:
      - What administrative work keeps your best agents from talking to clients?

discovery_question_banks:
  lead_generation:
    - text: Which sources generate buyers and sellers today?
      purpose: source mix
    - text: Which sources ultimately create closed transactions?
      purpose: source economics
  phone_after_hours:
    - text: What happens to new portal or web inquiries after hours?
      purpose: response coverage
  scheduling_dispatch:
    - text: How are buyer showings and listing consultations scheduled and rescheduled?
      purpose: appointment workflow
  sales_follow_up:
    - text: What happens after the first unanswered contact attempt?
      purpose: contact cadence
    - text: What happens to a good lead that is six months away?
      purpose: long-term nurture
  retention_reactivation:
    - text: How are old internet, open-house and past-client databases reactivated?
      purpose: database value
  employee_capacity:
    - text: Which administrative work keeps agents or ISA staff from client conversations?
      purpose: capacity
  reporting:
    - text: Can management compare response, appointments, clients and closings by source and agent?
      purpose: management visibility
  systems_crm:
    - text: Does every lead source enter the CRM and are calls, texts and emails visible?
      purpose: CRM discipline
  attribution:
    - text: Can closed transactions be tied to the original source and campaign?
      purpose: source-to-close attribution
  technical_constraints:
    - text: Which licensed, fair-housing, negotiation and contract decisions must remain human?
      purpose: professional boundary

offer_mapping:
  - opportunity_category: speed_to_lead
    possible_offer_families:
      - ai_growth_systems
      - ai_implementation
    positioning: Improve capture, routing, acknowledgment, appointment support and next-action consistency around internet leads.
    required_discovery_before_recommending:
      - lead_sources
      - response_time
      - routing_rules
      - CRM
    do_not_recommend_if:
      - response_process_already_strong
  - opportunity_category: follow_up
    possible_offer_families:
      - ai_growth_systems
      - ai_implementation
    positioning: Preserve future timing, automate appropriate nurture support and keep agent-owned next actions visible.
    required_discovery_before_recommending:
      - lead_statuses
      - current_nurture
      - agent_usage
      - communication_permissions
    do_not_recommend_if:
      - nurture_already_strong_and_measured
  - opportunity_category: CRM_workflow
    possible_offer_families:
      - ai_implementation
      - managed_ai_department
    positioning: Improve routing, CRM discipline, lead ownership and management visibility without replacing a working platform unnecessarily.
    required_discovery_before_recommending:
      - current_CRM
      - routing_rules
      - agent_adoption
    do_not_recommend_if:
      - current_system_already_solves_problem
  - opportunity_category: attribution
    possible_offer_families:
      - ai_growth_systems
      - ai_implementation
    positioning: Connect source through conversation, appointment, client and closed transaction using brokerage-approved revenue metrics.
    required_discovery_before_recommending:
      - lead_sources
      - CRM
      - closing_data
      - brokerage_value_metric
    do_not_recommend_if:
      - attribution_already_reliable

roi_tools:
  - roi_tool_id: lead_response_roi
    name: Lead Response ROI
    relevant_hypothesis_ids:
      - speed_to_lead
      - long_term_nurture
    required_inputs:
      - lead_volume
      - affected_segment_percent
      - legitimate_prospect_percent
      - conservative_incremental_conversion
      - brokerage_selected_value_metric
      - time_horizon
    prohibited_shortcuts:
      - treating_every_lead_as_transaction
      - presenting_long_cycle_value_as_guaranteed_monthly_revenue
  - roi_tool_id: lead_reactivation_roi
    name: Lead Reactivation ROI
    relevant_hypothesis_ids:
      - long_term_nurture
      - seller_follow_up
    required_inputs:
      - contactable_records
      - legitimately_relevant_percent
      - response_rate_scenario
      - client_conversion_scenario
      - brokerage_selected_value_metric
    prohibited_shortcuts:
      - valuing_entire_database_as_recoverable_transactions
  - roi_tool_id: employee_capacity_roi
    name: Employee Capacity ROI
    relevant_hypothesis_ids:
      - agent_capacity
    required_inputs:
      - employee_or_agent_count
      - repetitive_hours
      - addressable_percent
      - loaded_hourly_cost_or_capacity_metric
    prohibited_shortcuts:
      - guaranteed_payroll_savings
  - roi_tool_id: advertising_efficiency_roi
    name: Advertising Efficiency
    relevant_hypothesis_ids:
      - source_to_close_attribution
    required_inputs:
      - actual_ad_or_portal_cost
      - leads
      - conversations
      - appointments
      - clients
      - closings
      - brokerage_value_metric
    prohibited_shortcuts:
      - guessing_ad_spend
      - guessing_commission_rate

objection_guidance:
  - objection_id: relationship_based
    match_phrases:
      - real estate is relationship based
    principle: Agree and position systems as support for relationships rather than replacement.
    response_guidance: Focus on reminders, tracking, summaries and routine nurture so agents have more time for clients.
    follow_up_questions:
      - Which relationship-support tasks are repetitive enough to automate?
    must_not_say:
      - AI should replace agents
    manual_reference: module-26-real-estate-brokerages-industry-playbook.md#19-objections
  - objection_id: CRM_already_nurtures
    match_phrases:
      - our CRM already nurtures
    principle: Existing automation is positive if used and measured well.
    response_guidance: Ask whether agents use it consistently and whether nurture can be tied to appointments, clients and closings.
    follow_up_questions:
      - Can you see future-timing leads and source-to-close results by agent?
    must_not_say:
      - you need another CRM
    manual_reference: module-26-real-estate-brokerages-industry-playbook.md#19-objections
  - objection_id: AI_cannot_negotiate
    match_phrases:
      - AI cannot negotiate for our clients
    principle: Agree; representation, negotiation, contracts and licensed judgment remain human.
    response_guidance: Reframe around lead response, CRM, nurture, admin and reporting.
    follow_up_questions: []
    must_not_say:
      - AI can represent buyers or sellers
    manual_reference: module-26-real-estate-brokerages-industry-playbook.md#19-objections

safety_boundaries:
  - boundary_id: licensed_real_estate
    category: professional_judgment
    prohibited_agent_claims:
      - negotiation_on_behalf_of_client
      - licensed_representation
      - contract_advice
      - pricing_or_fiduciary_decision
    human_required_for:
      - negotiation
      - representation
      - contract_decisions
      - pricing_strategy
      - fiduciary_judgment
    escalation_guidance: Licensed agents/brokers retain professional representation and transaction judgment.
  - boundary_id: fair_housing
    category: anti_discrimination
    prohibited_agent_claims:
      - discriminatory_lead_routing
      - protected_class_targeting
      - neighborhood_recommendation_based_on_protected_traits
    human_required_for:
      - fair_housing_sensitive_decisions
    escalation_guidance: Routing, targeting and customer interactions must respect applicable fair-housing and anti-discrimination rules.
  - boundary_id: marketing_economics
    category: financial_truth
    prohibited_agent_claims:
      - guessed_commission_rate
      - guaranteed_closing
      - guaranteed_lead_value
    human_required_for:
      - brokerage_economic_inputs
    escalation_guidance: Use brokerage-provided transaction and revenue metrics.

no_sale_conditions:
  - low_lead_volume
  - CRM_nurture_and_response_already_strong
  - no_measurable_workflow_problem
  - economics_weak
  - requested_automation_conflicts_with_licensing_or_fair_housing
  - required_integration_not_feasible
  - guaranteed_closings_demanded
  - employee_or_agent_replacement_is_primary_goal

scoring_overrides:
  enabled: false
  rule: Use canonical Module 4C only. High-value economics and lead-volume scoring require evidence about the brokerage/team model rather than assuming every agent qualifies.

research_requirements:
  minimum_before_research_ready:
    - company_identity
    - brokerage_or_team_type_attempted
    - geography
    - website_attempted
    - google_ad_check_attempted
  refresh_before_ad_specific_opener:
    - current_paid_ad_evidence
  optional_deep_research:
    - meta_ads
    - seller_home_value_CTA
    - portal_lead_signals
    - multiple_offices
    - visible_hiring
    - leadership_roles
    - open_house_activity
  forbidden_research_actions:
    - fake_buyer_inquiry
    - fake_seller_inquiry
    - fake_showing_request
    - fake_home_valuation_request
    - fake_open_house_registration

call_pack_defaults:
  preferred_primary_hook_order:
    - long_term_nurture
    - speed_to_lead
    - seller_follow_up
    - attribution
    - agent_capacity
  default_first_question: What happens to a good buyer or seller lead that says they are six months away?
  employee_safe_positioning: Systems can remember, route and nurture while agents keep the human work of advice, negotiation, representation and trust.
  default_prohibited_claims:
    - known_ad_spend_without_verified_data
    - known_commission_rate_without_brokerage_data
    - every_lead_will_close
    - AI_can_negotiate_or_represent_clients
    - discriminatory_lead_routing
