system_families:
  - system_family_id: shop_management
    names: []
    category: repair_production_management
    frontend_detection_terms: []
    positioning_rule: Shop-management software may manage production while pre-repair lead/CRM/attribution workflows can still live elsewhere. Do not assume a second CRM is required.
    questions:
      - Where are pre-estimate leads stored?
      - Can unsold estimates be segmented and followed up?
      - Can lead source be tied to repair revenue?
  - system_family_id: estimating
    names: []
    category: estimating
    frontend_detection_terms: []
    positioning_rule: Estimating-system presence does not prove marketing, follow-up or CRM workflows are complete.
    questions:
      - What happens to a written estimate after the customer leaves without scheduling?
  - system_family_id: call_tracking
    names: []
    category: call_attribution
    frontend_detection_terms:
      - call tracking
    positioning_rule: Call-tracking presence does not prove source-to-repair-order attribution.
    questions:
      - Can the original call source be tied to the final repair order?

