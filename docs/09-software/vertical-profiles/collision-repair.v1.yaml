objection_guidance:
  - objection_id: management_software_already_does_that
    match_phrases:
      - our management software already does that
    principle: If it works, leave it alone; test configuration and adoption rather than attacking the platform.
    response_guidance: Ask whether the relevant feature is configured, consistently used and connected to pre-repair lead and communication workflows.
    follow_up_questions:
      - Can it show every unsold estimate and its next action?
    must_not_say:
      - your management software is bad
    manual_reference: module-13-collision-repair-industry-playbook.md#29-collision-objections
  - objection_id: insurer_work_no_marketing
    match_phrases:
      - we get work from insurance
      - we do not need marketing
    principle: Respect the business mix and investigate direct/referral channels only if relevant.
    response_guidance: Ask how direct, dealer, referral and prior-customer channels are measured.
    follow_up_questions:
      - Which non-insurer sources create repair orders today?
    must_not_say: []
    manual_reference: module-13-collision-repair-industry-playbook.md#29-collision-objections
  - objection_id: customers_want_human_updates
    match_phrases:
      - customers want human updates
    principle: Preserve human relationships while reducing routine workload.
    response_guidance: Explain that reminders, routine notifications and internal data movement can support the human conversation.
    follow_up_questions:
      - Which updates are repetitive and which require judgment?
    must_not_say:
      - AI should replace customer service
    manual_reference: module-13-collision-repair-industry-playbook.md#29-collision-objections
  - objection_id: no_ai_repair_decisions
    match_phrases:
      - we do not want AI touching repair decisions
    principle: Agree; repair and safety decisions remain with qualified people.
    response_guidance: Focus on intake, communication, CRM, documents and reporting around the repair process.
    follow_up_questions: []
    must_not_say:
      - AI can decide repair procedures
    manual_reference: module-13-collision-repair-industry-playbook.md#29-collision-objections

safety_boundaries:
  - boundary_id: repair_safety
    category: technical_safety
    prohibited_agent_claims:
      - repair_procedure_decision
      - vehicle_safety_clearance
      - structural_repair_judgment
      - calibration_requirement_decision
    human_required_for:
      - repair_plan
      - safety_decisions
      - technical_diagnosis
      - quality_control
    escalation_guidance: Qualified repair professionals remain responsible for repair and safety decisions.
  - boundary_id: insurance_claim
    category: insurance_legal
    prohibited_agent_claims:
      - insurance_coverage_decision
      - claim_outcome_guarantee
      - unauthorized_adjusting_advice
    human_required_for:
      - claim_specific_advice
      - contractual_or_financial_decisions
    escalation_guidance: Route consequential insurer, contractual and financial questions to qualified staff.
  - boundary_id: customer_status_truth
    category: communication_truth
    prohibited_agent_claims:
