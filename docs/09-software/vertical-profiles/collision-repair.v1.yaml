    possible_offer_families:
      - ai_implementation
      - ai_growth_systems
    positioning: Improve overflow, callback, intake and CRM capture around the existing front office.
    required_discovery_before_recommending:
      - call_volume
      - missed_call_process
      - current_phone_system
      - scheduling_rules
    do_not_recommend_if:
