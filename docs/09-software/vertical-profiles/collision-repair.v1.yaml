  - opportunity_category: unsold_estimate
    possible_offer_families:
      - ai_implementation
      - ai_growth_systems
    positioning: Improve pre-repair pipeline, follow-up tasks and reactivation before recommending new software.
    required_discovery_before_recommending:
      - estimate_volume
      - current_follow_up
      - shop_management_system
    do_not_recommend_if:
