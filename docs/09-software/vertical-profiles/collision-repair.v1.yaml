discovery_question_banks:
  lead_generation:
    - text: How many estimate inquiries arrive each month and from which sources?
      purpose: lead volume and source mix
    - text: Which source produces the best repair orders?
      purpose: source economics
  phone_after_hours:
    - text: What happens after hours or when the front desk cannot answer?
      purpose: overflow
  scheduling_dispatch:
    - text: How are estimate appointments scheduled and rescheduled?
      purpose: estimate conversion
  sales_follow_up:
    - text: What percentage of written estimates never become repair orders?
      purpose: open opportunity
    - text: Who owns the next step on unsold estimates?
      purpose: follow-up ownership
  retention_reactivation:
    - text: How are old estimate leads and prior customers reactivated?
      purpose: dormant opportunity
  employee_capacity:
    - text: Which status, document or CRM task consumes the most front-office time?
      purpose: capacity
  reporting:
    - text: Which KPI or report takes the most manual work?
      purpose: reporting friction
  systems_crm:
    - text: Where do pre-estimate leads live before they become repair orders?
      purpose: pre-repair CRM map
  attribution:
    - text: Can lead source be tied to scheduled repair, repair order and revenue?
      purpose: closed-loop measurement
  technical_constraints:
    - text: Which repair, safety, insurer or financial decisions must remain under qualified human control?
      purpose: safety boundary

offer_mapping:
