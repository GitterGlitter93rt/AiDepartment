public_signal_rules:
  - signal_id: active_google_search_ads
    category: paid_acquisition
    evidence_claim_key: active_google_search_ad
    confidence_required: confirmed
    why_it_matters: Current paid estimate demand makes response, missed-call recovery and source-to-repair-order attribution worth testing.
    possible_hypothesis_ids:
      - estimate_call_overflow
      - estimate_lead_response
      - attribution_gap
    score_rule_reference: module4c_google_ads_plus4
  - signal_id: active_meta_ads
    category: paid_acquisition
    evidence_claim_key: active_meta_ad
    confidence_required: confirmed
    why_it_matters: Meta or social lead capture can create form-driven estimate opportunities requiring routing and follow-up.
    possible_hypothesis_ids:
      - estimate_lead_response
      - estimate_follow_up
    score_rule_reference: module4c_meta_ads_plus3
  - signal_id: online_estimate_cta
    category: lead_capture
    evidence_claim_key: online_quote_booking
    confidence_required: confirmed
    why_it_matters: A visible estimate form or scheduling path creates an observable pre-repair workflow.
    possible_hypothesis_ids:
      - estimate_lead_response
      - crm_capture
      - estimate_follow_up
    score_rule_reference: module4c_lead_capture_plus1
  - signal_id: multiple_locations
    category: scale
    evidence_claim_key: multiple_locations
    confidence_required: confirmed
    why_it_matters: Multi-location/MSO operations increase lead routing, process consistency, attribution and reporting needs.
    possible_hypothesis_ids:
      - multi_location_consistency
      - attribution_gap
      - reporting_visibility
    score_rule_reference: module4c_multiple_locations_plus1
  - signal_id: hail_service
    category: surge
    evidence_claim_key: hail_repair_service
    confidence_required: confirmed
    why_it_matters: Hail can create temporary estimate and front-office surges.
    possible_hypothesis_ids:
      - estimate_call_overflow
      - surge_capacity
    score_rule_reference: vertical_priority_signal_only
  - signal_id: visible_hiring
    category: growth
    evidence_claim_key: visible_growth_hiring
    confidence_required: confirmed
    why_it_matters: Hiring can make front-office capacity, reporting and process consistency more relevant.
    possible_hypothesis_ids:
      - front_office_capacity
      - multi_location_consistency
    score_rule_reference: module4c_growth_plus1

