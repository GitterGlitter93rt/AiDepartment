leak_hypotheses:
  - hypothesis_id: estimate_call_overflow
    category: missed_call
    title: Estimate opportunities may be missed when the front office is saturated
    description: New estimate calls can collide with customer pickups, insurer calls and status requests.
    trigger_signals:
      - active_google_search_ads
      - phone_heavy_site
      - hail_service
      - visible_hiring
    disqualifying_signals:
      - prospect_confirms_strong_measured_overflow_process
    public_fact_requirements:
      - current_paid_ad_evidence_if_referenced
    questions_to_verify:
      - When the front office is already tied up and a new estimate call comes in, what happens to it?
      - Does every missed estimate call create a record and next action?
    primary_hook_template: When a new estimate call hits while the front office is already tied up, what makes sure that opportunity gets recovered?
    backup_hook_templates:
      - What happens to estimate calls after hours?
    offer_families:
      - ai_implementation
      - ai_growth_systems
    roi_tool_ids:
      - missed_call_roi
    must_not_claim:
      - every_missed_call_is_a_lost_repair
      - known_missed_call_rate_without_data
  - hypothesis_id: estimate_follow_up
    category: unsold_estimate
    title: Unsold estimates may lack a defined next action
    description: Written estimates that do not immediately schedule can disappear from view without structured follow-up.
    trigger_signals:
      - online_estimate_cta
      - high_estimate_volume_signal
      - paid_acquisition
    disqualifying_signals:
      - prospect_confirms_strong_measured_estimate_follow_up
    public_fact_requirements: []
    questions_to_verify:
      - How many written estimates never become repair orders?
      - Who owns follow-up after a customer leaves without scheduling?
    primary_hook_template: After somebody gets an estimate and leaves without scheduling, what happens next?
    backup_hook_templates:
      - Can management see unsold estimate value by age and reason?
    offer_families:
      - ai_implementation
      - ai_growth_systems
    roi_tool_ids:
      - unsold_estimate_follow_up_roi
      - lead_reactivation_roi
    must_not_claim:
      - every_unsold_estimate_is_recoverable
  - hypothesis_id: customer_status_capacity
    category: customer_communication
    title: Repetitive status calls may consume front-office capacity
    description: Customers may repeatedly call for repair status when reliable progress data is not pushed consistently.
    trigger_signals:
      - customer_status_language
      - busy_front_office_signal
      - multi_location_signal
    disqualifying_signals:
      - prospect_confirms_strong_automated_status_process
    public_fact_requirements: []
    questions_to_verify:
      - What customer status question hits the front desk most often?
      - Which repair-status data is reliable enough to trigger updates?
    primary_hook_template: What customer status question does your front desk answer over and over every day?
    backup_hook_templates:
      - Where does repair-status information live and who updates it?
    offer_families:
      - ai_implementation
      - managed_ai_department
    roi_tool_ids:
      - employee_capacity_roi
    must_not_claim:
      - all_status_calls_can_be_automated
      - completion_dates_are_reliably_known_without_system_data
  - hypothesis_id: attribution_gap
    category: attribution
    title: Marketing may not be tied through actual repair orders
    description: Paid channels can report calls/forms while the shop needs source visibility through estimate, scheduled repair, repair order and revenue.
    trigger_signals:
      - active_google_search_ads
      - active_meta_ads
      - call_tracking_signal
    disqualifying_signals:
      - prospect_confirms_closed_loop_attribution
    public_fact_requirements: []
    questions_to_verify:
      - Can you trace the original ad or call source through to repair order and revenue?
      - Which channel produces actual repair orders rather than just estimate leads?
    primary_hook_template: Can you trace a paid estimate lead all the way through to the repair order and revenue?
    backup_hook_templates:
      - Can phone calls be attributed to the original campaign?
    offer_families:
      - ai_growth_systems
      - ai_implementation
    roi_tool_ids:
      - advertising_efficiency_roi
    must_not_claim:
      - attribution_is_broken
  - hypothesis_id: front_office_capacity
    category: employee_capacity
    title: Front-office staff may be carrying avoidable repetitive administration
    description: Call summaries, status messages, documents, reminders, CRM updates and reporting can consume employee capacity.
    trigger_signals:
      - visible_hiring
      - multiple_locations
      - online_estimate_cta
    disqualifying_signals: []
    public_fact_requirements: []
    questions_to_verify:
      - What repetitive front-office task would the team be happiest never doing manually again?
      - If repair volume grew 25 percent, where would administrative capacity break first?
    primary_hook_template: What repetitive front-office task eats the most time without requiring repair judgment?
    backup_hook_templates:
      - Where is customer or claim information entered more than once?
    offer_families:
      - ai_implementation
      - managed_ai_department
    roi_tool_ids:
      - employee_capacity_roi
    must_not_claim:
      - staff_should_be_replaced

