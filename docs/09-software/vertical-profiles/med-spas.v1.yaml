profile_id: med-spas-us-v1
version: 1.0.0
status: architecture_draft
industry_name: Medical Spas
industry_aliases:
  - med spa
  - medical spa
  - aesthetic clinic
  - aesthetics practice
priority: 10
country_scope: [US]
source_manual_paths:
  - docs/07-sales/training-manual/module-19-med-spas-industry-playbook.md
  - docs/07-sales/training-manual/module-04c-prospect-qualification-and-target-scoring.md
  - docs/07-sales/training-manual/module-05-hooks-and-opening-angles.md
source_manual_commit: main-current-at-profile-review

business_model:
  revenue_categories:
    - injectables
    - laser_light_treatments
    - skin_treatments
    - body_contouring
    - hair_related_treatments
    - wellness_services_where_legal
    - memberships
    - packages
    - retail_products
  lead_types:
    - meta_lead_form
    - instagram_dm
    - facebook_message
    - google_paid_search
    - organic_search
    - website_form
    - phone
    - referral
  customer_types: [patients_clients]
  high_value_service_families:
    - injectable_programs
    - laser_packages
    - body_contouring
    - higher_value_aesthetic_programs
  recurring_revenue_families:
    - memberships
    - packages
    - repeat_treatment_relationships
  urgency_characteristics:
    - generally_non_emergency
  seasonality_characteristics:
    - offer_and_service_dependent
  phone_dependence: medium
  appointment_dependence: very_high
  estimate_proposal_dependence: medium
  field_service_dependence: none

search_taxonomy:
  core_queries:
    - query: med spa
      family: core
      intent_weight: 4
      priority: 1
      recommended_for_paid_serp: true
      recommended_for_places_gap_fill: true
    - query: medical spa
      family: core
      intent_weight: 4
      priority: 2
      recommended_for_paid_serp: true
      recommended_for_places_gap_fill: true
  high_intent_queries:
    - query: laser hair removal
      family: treatment
      intent_weight: 5
      priority: 1
      recommended_for_paid_serp: true
      recommended_for_places_gap_fill: true
    - query: body contouring
      family: treatment
      intent_weight: 5
      priority: 2
      recommended_for_paid_serp: true
      recommended_for_places_gap_fill: true
    - query: cosmetic injectable clinic
      family: treatment
      intent_weight: 5
      priority: 1
      recommended_for_paid_serp: true
      recommended_for_places_gap_fill: true
    - query: facial skin treatment
      family: treatment
      intent_weight: 4
      priority: 2
      recommended_for_paid_serp: true
      recommended_for_places_gap_fill: true
  urgent_queries: []
  high_ticket_queries:
    - body contouring
    - laser package
    - aesthetic treatment package
  financing_queries:
    - med spa financing
    - aesthetic treatment financing
  commercial_queries: []
  service_aliases:
    - aesthetics
    - cosmetic treatments
    - laser aesthetics
  negative_terms:
    - spa supplies
    - cosmetology school
    - med spa training
    - equipment supplier
  classification_warning_terms:
    - day spa only
    - salon only
    - plastic surgery practice
    - dermatology practice

classification_rules:
  positive_business_categories:
    - medical_spa
    - aesthetic_clinic
  negative_business_categories:
    - beauty_school
    - equipment_supplier
    - day_spa_only
  website_keyword_positive:
    - consultation
    - injectables
    - laser hair removal
    - body contouring
    - membership
  website_keyword_negative:
    - training certification only
    - equipment wholesale
  required_any_of:
    - medical_aesthetic_service_evidence
    - consultation_booking_evidence
  exclude_if_all:
    - non_medical_aesthetic_business
  manual_review_if:
    - day_spa_med_spa_mix_unclear
    - dermatology_or_plastic_surgery_primary

public_signal_rules:
  - signal_id: active_meta_ads
    category: paid_acquisition
    evidence_claim_key: active_meta_ad
    confidence_required: confirmed
    why_it_matters: Meta/Instagram are high-value discovery channels for this vertical and make response/follow-up questions relevant.
    possible_hypothesis_ids: [meta_speed_to_lead, unbooked_follow_up, attribution]
    score_rule_reference: module4c_meta_ads_plus3
  - signal_id: active_google_search_ads
    category: paid_acquisition
    evidence_claim_key: active_google_search_ad
    confidence_required: confirmed
    why_it_matters: Current treatment-specific search ads strengthen paid-demand response/attribution relevance.
    possible_hypothesis_ids: [speed_to_lead, attribution]
    score_rule_reference: module4c_google_ads_plus4
  - signal_id: online_booking
    category: lead_capture
    evidence_claim_key: online_quote_booking
    confidence_required: confirmed
    why_it_matters: Shows consultation/appointment entry path and no-show/reschedule relevance.
    possible_hypothesis_ids: [consultation_no_show, scheduling]
    score_rule_reference: module4c_lead_capture_plus1
  - signal_id: multiple_locations
    category: scale
    evidence_claim_key: multiple_locations
    confidence_required: confirmed
    why_it_matters: Increases lead routing, consistency and attribution needs.
    possible_hypothesis_ids: [routing_consistency, attribution]
    score_rule_reference: module4c_multiple_locations_plus1
  - signal_id: visible_hiring
    category: growth
    evidence_claim_key: visible_growth_hiring
    confidence_required: confirmed
    why_it_matters: Makes coordinator/front-desk capacity relevant.
    possible_hypothesis_ids: [coordinator_capacity]
    score_rule_reference: module4c_growth_plus1

customer_journey:
  - stage_id: demand
    label: Social/search/referral interest
    common_inputs: [meta, instagram, google, referral]
    common_outputs: [dm, call, form, lead_ad]
    handoff_risks: [channel_fragmentation]
    human_judgment_required: false
  - stage_id: response
    label: Lead response / basic intake
    common_inputs: [dm, call, form, lead_ad]
    common_outputs: [consultation_offer, appointment]
    handoff_risks: [slow_response, no_second_attempt, lost_dm]
    human_judgment_required: true
  - stage_id: consultation
    label: Consultation / appointment
    common_inputs: [appointment]
    common_outputs: [show, no_show, reschedule]
    handoff_risks: [no_show, unfilled_slot]
    human_judgment_required: true
  - stage_id: clinical
    label: Clinical evaluation / consent / treatment decision
    common_inputs: [show]
    common_outputs: [treatment_booked, not_appropriate, future]
    handoff_risks: [unbooked_followup]
    human_judgment_required: true
  - stage_id: retention
    label: Rebook / package / membership / reactivation
    common_inputs: [completed_treatment]
    common_outputs: [repeat_visit, member, reactivated]
    handoff_risks: [reactivation_gap, membership_followup_gap]
    human_judgment_required: true

leak_hypotheses:
  - hypothesis_id: meta_speed_to_lead
    category: speed_to_lead
    title: Meta/Instagram lead response
    trigger_signals: [active_meta_ads]
    disqualifying_signals: []
    public_fact_requirements: []
    questions_to_verify:
      - How fast does a new Meta lead get a real response?
      - What happens if the prospect does not answer the first message or call?
    primary_hook_template: I noticed you're running campaigns for {service_or_offer}. Once one of those paid inquiries comes in, how quickly does somebody respond and what happens if they don't book the first time?
    backup_hook_templates:
      - Do your DMs, lead forms, calls and website forms all enter the same follow-up process?
    offer_families: [AI_Growth_Systems, AI_Implementation]
    roi_tool_ids: [lead_response_roi]
    must_not_claim: [ad_spend_amount, lead_loss_amount, treatment_suitability]
  - hypothesis_id: consultation_no_show
    category: no_show_recovery
    title: Consultation no-show / slot recovery
    trigger_signals: [online_booking]
    disqualifying_signals: []
    public_fact_requirements: []
    questions_to_verify:
      - What is your consultation no-show or late-cancel rate?
      - How fast can an empty slot be refilled?
    primary_hook_template: What happens after a consultation no-show or late cancellation—does the system recover the prospect and the slot?
    backup_hook_templates: []
    offer_families: [AI_Implementation]
    roi_tool_ids: [no_show_roi]
    must_not_claim: [every_no_show_recoverable]
  - hypothesis_id: unbooked_follow_up
    category: sales_follow_up
    title: Unbooked inquiry / consultation follow-up
    trigger_signals: [active_meta_ads, active_google_search_ads]
    disqualifying_signals: []
    public_fact_requirements: []
    questions_to_verify:
      - What happens when a legitimate prospect needs time, has a scheduling issue, or has a financing question?
    primary_hook_template: What happens to a legitimate treatment inquiry that doesn't book during the first conversation?
    backup_hook_templates: []
    offer_families: [AI_Implementation, AI_Growth_Systems]
    roi_tool_ids: [lead_response_roi]
    must_not_claim: [pressure_clinical_treatment]
  - hypothesis_id: coordinator_capacity
    category: employee_capacity
    title: Front-desk / coordinator capacity
    trigger_signals: [visible_hiring]
    disqualifying_signals: []
    public_fact_requirements: []
    questions_to_verify:
      - Which repetitive scheduling, DM, follow-up or CRM task consumes the most coordinator time?
    primary_hook_template: If your best coordinator had five extra hours each week, where would you want that time spent?
    backup_hook_templates: []
    offer_families: [AI_Implementation, Managed_AI_Department]
    roi_tool_ids: [employee_capacity_roi]
    must_not_claim: [staff_replacement]
  - hypothesis_id: attribution
    category: attribution
    title: Campaign-to-paying-client attribution
    trigger_signals: [active_meta_ads, active_google_search_ads]
    disqualifying_signals: []
    public_fact_requirements: []
    questions_to_verify:
      - Which campaigns produce paying clients rather than cheap leads?
      - Can you compare cost per consultation show and acquired client?
    primary_hook_template: Can you trace a campaign from lead through consultation show and paying-client outcome using an appropriate privacy-safe business metric?
    backup_hook_templates: []
    offer_families: [AI_Growth_Systems]
    roi_tool_ids: [attribution_roi]
    must_not_claim: [revenue_without_client_data]

decision_maker_roles:
  - role_category: owner_founder
    titles: [Owner, Founder, Medical Director Owner]
    relevant_hypothesis_ids: [meta_speed_to_lead, coordinator_capacity, attribution]
    priority: 1
  - role_category: operations
    titles: [Operations Manager, Director of Operations]
    relevant_hypothesis_ids: [consultation_no_show, unbooked_follow_up, coordinator_capacity]
    priority: 1
  - role_category: office_manager
    titles: [Practice Manager, Office Manager, Front Desk Manager]
    relevant_hypothesis_ids: [consultation_no_show, coordinator_capacity]
    priority: 1
  - role_category: marketing
    titles: [Marketing Director, Marketing Manager, Growth Manager]
    relevant_hypothesis_ids: [meta_speed_to_lead, attribution]
    priority: 1
  - role_category: other_relevant
    titles: [Patient Coordinator, Treatment Coordinator]
    relevant_hypothesis_ids: [unbooked_follow_up, consultation_no_show]
    priority: 2

system_families:
  - system_family_id: medspa_crm_practice_stack
    names: [CRM, practice management, EMR where applicable, scheduling, messaging, Meta lead forms, payments memberships]
    category: healthcare_business_system
    frontend_detection_terms: []
    positioning_rule: Map current approved systems and privacy boundaries before moving lead or clinical data.
    questions:
      - Do DMs, lead forms, calls and web forms enter one follow-up system?
      - Can unbooked inquiries and no-shows be surfaced?

hook_priorities:
  - hook_family: speed_to_lead
    base_priority: 10
    boost_if_signals: [active_meta_ads, active_google_search_ads]
    demote_if_signals: []
    avoid_if: []
    question_templates:
      - How fast does a paid treatment inquiry get a real response?
  - hook_family: no_show_recovery
    base_priority: 9
    boost_if_signals: [online_booking]
    demote_if_signals: []
    avoid_if: []
    question_templates:
      - What happens after a consultation no-show?
  - hook_family: unbooked_follow_up
    base_priority: 9
    boost_if_signals: [active_meta_ads]
    demote_if_signals: []
    avoid_if: []
    question_templates:
      - What happens to an inquiry that doesn't book the first time?
  - hook_family: attribution
    base_priority: 8
    boost_if_signals: [active_meta_ads, active_google_search_ads]
    demote_if_signals: []
    avoid_if: []
    question_templates:
      - Which campaigns produce paying clients rather than just leads?

discovery_question_banks:
  lead_generation:
    - text: Which services and channels generate the most inquiries?
      purpose: source_mix
      data_field_created: lead_sources
  phone_after_hours:
    - text: How fast do DMs, calls and lead forms get a real response?
      purpose: response_process
      data_field_created: response_time
  scheduling_dispatch:
    - text: What is the consultation no-show or late-cancel rate and what happens after it?
      purpose: schedule_utilization
      data_field_created: no_show_process
  sales_follow_up:
    - text: How are legitimate prospects followed up if they do not book immediately?
      purpose: lead_followup
      data_field_created: followup_process
  employee_capacity:
    - text: Which repetitive coordinator task consumes the most time?
      purpose: capacity
      data_field_created: coordinator_capacity
  systems_crm:
    - text: Do DMs, lead forms, calls and website inquiries all enter one approved system?
      purpose: system_map
      data_field_created: systems
  attribution:
    - text: Can you tie campaign source through consultation show and paying-client outcome?
      purpose: attribution
      data_field_created: attribution_state

offer_mapping:
  - opportunity_category: speed_to_lead
    possible_offer_families: [AI_Growth_Systems, AI_Implementation]
    positioning: Improve routing, immediate response, scheduling and follow-up around coordinators without automating clinical decisions.
    required_discovery_before_recommending: [lead_channels, response_time, current_systems, privacy_scope]
    do_not_recommend_if: [strong_existing_workflow]
  - opportunity_category: coordinator_capacity
    possible_offer_families: [AI_Implementation, Managed_AI_Department]
    positioning: Reduce repetitive lead/scheduling/admin work while the team retains patient/client relationships and clinical judgment.
    required_discovery_before_recommending: [task_volume, system_access, privacy_requirements]
    do_not_recommend_if: [privacy_requirements_not_met]

roi_tools:
  - roi_tool_id: lead_response_roi
    name: Lead Response ROI
    relevant_hypothesis_ids: [meta_speed_to_lead, unbooked_follow_up]
    required_inputs: [lead_volume, delayed_or_unworked_percent, legitimate_percent, incremental_booking_scenario, client_selected_value_metric]
    prohibited_shortcuts: [use_industry_average_as_prospect_value]
  - roi_tool_id: no_show_roi
    name: No-Show ROI
    relevant_hypothesis_ids: [consultation_no_show]
    required_inputs: [appointments, no_show_rate, recovery_or_refill_scenario, client_selected_value_metric]
    prohibited_shortcuts: [assume_every_slot_recoverable]
  - roi_tool_id: employee_capacity_roi
    name: Employee Capacity ROI
    relevant_hypothesis_ids: [coordinator_capacity]
    required_inputs: [employees, repetitive_hours, addressable_percent, loaded_cost]
    prohibited_shortcuts: [treat_capacity_as_guaranteed_savings]

objection_guidance:
  - objection_id: clinical_judgment
    match_phrases: [AI can't decide treatment, we need providers to evaluate]
    principle: preserve_clinical_control
    response_guidance: Agree. Focus YAD on non-clinical inquiry response, scheduling, follow-up, administrative workflow and reporting.
    follow_up_questions:
      - Which repetitive non-clinical step creates the most coordinator work?
    must_not_say: [AI_can_recommend_treatment]
    manual_reference: module-19

safety_boundaries:
  - boundary_id: medspa_clinical
    category: healthcare
    prohibited_agent_claims:
      - AI_can_determine_treatment_suitability
      - AI_can_recommend_medical_treatment
      - YAD_guarantees_healthcare_compliance
    human_required_for:
      - clinical_evaluation
      - consent
      - treatment_decision
      - prescribing
      - adverse_event_handling
    escalation_guidance: Keep automation in approved business workflows around care.
  - boundary_id: privacy
    category: privacy
    prohibited_agent_claims:
      - public_AI_is_safe_for_PHI
    human_required_for:
      - privacy_security_vendor_review
      - BAA_or_HIPAA_review_where_applicable
    escalation_guidance: Do not move PHI/clinical data into unapproved CRM or AI tools.

no_sale_conditions:
  - no_meaningful_lead_or_followup_gap
  - privacy_requirements_not_met
  - clinical_decision_automation_requested
  - strong_existing_workflow
  - weak_economics

scoring_overrides:
  hidden_points: none
  use_canonical_module_4c: true

research_requirements:
  prioritize:
    - active_meta_ads
    - active_google_ads
    - treatment_offers
    - online_booking
    - consultation_cta
    - memberships_packages
    - multiple_locations
    - hiring
  do_not_infer:
    - treatment_suitability
    - patient_value
    - lead_volume
    - clinical_workflow
    - privacy_compliance

call_pack_defaults:
  preferred_primary_hook_family: speed_to_lead
  preferred_backup_hook_family: no_show_recovery
  maximum_confirmed_facts: 3
  default_next_step: strategy_conversation
