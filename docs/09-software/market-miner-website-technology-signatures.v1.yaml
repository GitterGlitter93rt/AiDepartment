  - technology_id: generic_chat_widget
    display_name: Chat Widget
    category: chat
    candidate_patterns: []
    default_confidence: provider_specific
    production_validation_note: Implement provider-specific signatures rather than a single vague `chat=true` regex.
    proves: Public chat/communication path exists when a validated widget is detected.
    never_proves:
