      - response_time
      - ai_chat

signature_validation_tests:
  - A visible brand name in article/blog/footer text alone does not confirm a technology unless signature rule explicitly permits contextual text.
  - Script/network/widget evidence outranks incidental plain-text mentions.
  - A technology signal can be confirmed while workflow remains unknown.
  - Missing signature is always unknown unless a separate affirmative negative source exists.
  - Broad candidate patterns for ServiceTitan/Housecall Pro/Jobber/Podium/Lawmatics/Clio must be narrowed with real fixture validation before high-confidence production use.
