catalog_id: yad_website_technology_signatures_v1
version: 1.0.0
status: architecture_seed_requires_implementation_validation
purpose: Candidate first-party website signatures for research classification. Claude must validate patterns against current public examples/docs before marking high-confidence production signatures.

rules:
  - Detection proves only the stated public/frontend signal.
  - Detection does not prove system-of-record status, workflow quality, integration completeness, automation existence, or active paid advertising unless the signature specifically represents a current ad observation source.
  - Absence of every signature means unknown, not no-system.
  - Multiple weak signatures can raise confidence but must follow configured signature policy.
  - Catalog changes are versioned and regression-tested against known pages/fixtures.

signatures:
  - technology_id: google_tag_manager
    display_name: Google Tag Manager
    category: tag_management
    candidate_patterns:
      - type: url_contains
        value: googletagmanager.com/gtm.js
      - type: text_regex
        value: 'GTM-[A-Z0-9]+'
    default_confidence: confirmed
    claim_key: website_technology_signal
    proves: Google Tag Manager container-related frontend code is present on the observed page.
    never_proves:
      - active_google_ads
      - correct_conversion_tracking
      - revenue_attribution

  - technology_id: google_analytics_4
    display_name: Google Analytics 4
    category: analytics
    candidate_patterns:
      - type: url_contains
        value: googletagmanager.com/gtag/js
      - type: text_regex
        value: 'G-[A-Z0-9]{5,}'
    default_confidence: likely
    production_validation_note: Avoid treating any arbitrary G-prefixed text as a measurement ID; require contextual script/config evidence.
    proves: GA4-related frontend measurement signal may be present.
    never_proves:
      - analytics_configured_correctly
      - conversion_tracking_correct
      - closed_loop_attribution

  - technology_id: google_ads_tag
    display_name: Google Ads Conversion / Google Tag Signal
    category: advertising_tracking
    candidate_patterns:
      - type: text_regex
        value: 'AW-[0-9]+'
      - type: context_contains
        value: google_conversion
    default_confidence: confirmed_when_contextual
    claim_key: google_ads_tag_signal
    proves: Google Ads-related frontend tag/config signal is present.
    never_proves:
      - active_google_search_ad
      - current_ad_spend
      - campaign_performance

  - technology_id: meta_pixel
    display_name: Meta Pixel
    category: advertising_tracking
    candidate_patterns:
      - type: url_contains
        value: connect.facebook.net
      - type: url_contains
        value: fbevents.js
      - type: text_contains
        value: "fbq('init'"
      - type: text_contains
        value: 'fbq("init"'
    default_confidence: confirmed_when_script_context
    claim_key: meta_pixel_signal
    proves: Meta/Facebook tracking code is present on the observed page.
    never_proves:
      - active_meta_ad
      - current_meta_spend
      - campaign_performance

  - technology_id: callrail
    display_name: CallRail
