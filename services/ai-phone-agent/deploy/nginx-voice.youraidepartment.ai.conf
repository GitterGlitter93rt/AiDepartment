# /etc/nginx/sites-available/voice.youraidepartment.ai
#
# A SEPARATE server block. Do not edit the existing static-site config —
# this file only ever handles the voice.* hostname.
#
#   sudo ln -s /etc/nginx/sites-available/voice.youraidepartment.ai \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream yad_voice_agent {
    server 127.0.0.1:3001;
    keepalive 32;
}

# Map is required for WebSocket upgrades. If the existing config already
# defines $connection_upgrade at http level, delete this block — a
# duplicate map directive will fail `nginx -t`.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name voice.youraidepartment.ai;

    # ACME challenges must stay on port 80 for Let's Encrypt renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name voice.youraidepartment.ai;

    ssl_certificate     /etc/letsencrypt/live/voice.youraidepartment.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voice.youraidepartment.ai/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Twilio posts small form bodies; the service caps at 64KB anyway.
    client_max_body_size 128k;

    access_log /var/log/nginx/voice.access.log;
    error_log  /var/log/nginx/voice.error.log warn;

    # --- ConversationRelay WebSocket ------------------------------
    # Separate location so the long timeouts apply ONLY to the call
    # socket. A phone call can run 10+ minutes with no bytes while the
    # caller is talking and we are listening, so the default 60s
    # proxy_read_timeout would drop live calls.
    location /twilio/conversation {
        proxy_pass http://yad_voice_agent;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;
        proxy_buffering off;   # stream speech tokens immediately
    }

    # --- Twilio HTTP webhooks + health ----------------------------
    location / {
        proxy_pass http://yad_voice_agent;
        proxy_http_version 1.1;

        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout  30s;
        proxy_connect_timeout 5s;
    }
}
