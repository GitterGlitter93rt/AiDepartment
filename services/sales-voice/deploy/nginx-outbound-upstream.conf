# HTTP-level upstream for Production Outbound Sales.
#
# Install to:  /etc/nginx/conf.d/yad-outbound-upstream.conf
#
# This file must live at http level, which is why it is separate from the locations
# file: an `upstream` block inside a `server` block is a configuration error, and a
# `location` block at http level is another. Splitting them is the only way both can
# be included without editing the receptionist's own directives.

upstream yad_sales_voice {
    server 127.0.0.1:3002;
    keepalive 16;
}

# WebSocket upgrade mapping. If the existing configuration already defines
# $connection_upgrade at http level, delete this block — a duplicate map is an error.
# Check first with:  grep -rn 'connection_upgrade' /etc/nginx/
map $http_upgrade $yad_outbound_connection_upgrade {
    default upgrade;
    ''      close;
}
