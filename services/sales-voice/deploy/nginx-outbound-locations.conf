# Server-level locations for Production Outbound Sales.
#
# Install to:  /etc/nginx/snippets/yad-outbound-locations.conf
# Then add ONE line inside the existing voice.youraidepartment.ai HTTPS server block:
#
#     include /etc/nginx/snippets/yad-outbound-locations.conf;
#
# That is the only edit to the receptionist's site file, and it adds routes without
# altering a single existing one. The receptionist keeps / and /twilio/*; outbound
# takes /outbound/* and nothing else.

# The relay socket has its own location so the long timeouts apply only to the call
# socket and not to ordinary requests.
location /outbound/twilio/conversation {
    proxy_pass http://yad_sales_voice;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $yad_outbound_connection_upgrade;
    proxy_set_header Host       $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A call can run for a while with no bytes in either direction.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
}

location /outbound/ {
    proxy_pass http://yad_sales_voice;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
