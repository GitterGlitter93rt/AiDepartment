# nginx locations for Production Outbound Sales.
#
# NOT YET APPLIED. This is a snippet to add inside the existing
# voice.youraidepartment.ai server block when the controlled-pilot gate opens. It
# adds routes; it changes none of the receptionist's.
#
# The receptionist keeps / and /twilio/*. Outbound takes /outbound/*, so the two
# services share a hostname and a certificate without sharing a route.

upstream yad_sales_voice {
    server 127.0.0.1:3002;
    keepalive 16;
}

# The relay socket gets its own location so the long timeouts apply only to the
# call socket and not to ordinary requests.
location /outbound/twilio/conversation {
    proxy_pass http://yad_sales_voice;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host       $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A call can run for a while with no bytes in either direction.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
}

location /outbound/ {
    proxy_pass http://yad_sales_voice;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
