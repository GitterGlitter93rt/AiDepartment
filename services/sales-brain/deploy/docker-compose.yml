# YAD Sales Brain — local canonical database.
# Bound to loopback only. Never expose 5432 publicly (deployment spec §9).
services:
  postgres:
    image: postgres:16-alpine
    container_name: yad-sales-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yad_sales}
      POSTGRES_USER: ${POSTGRES_USER:-yad_sales}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - yad_sales_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yad_sales} -d ${POSTGRES_DB:-yad_sales}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  yad_sales_pgdata:
    name: yad_sales_pgdata
