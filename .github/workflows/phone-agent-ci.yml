name: Phone Agent CI

# Manual-only while the outbound phone agent is under active development.
# This avoids triggering a CI run (and GitHub notification email) on every commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: phone-agent/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
